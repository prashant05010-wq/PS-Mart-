<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saved Addresses | PS Mart</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f1e8;
  color:#3b2416;
}

header{
  background:#4b2e1f;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header a{
  color:white;
  text-decoration:none;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
  color:#6b421f;
}

.address-box{
  border:1px solid #e5ddd2;
  background:#faf6ef;
  border-radius:10px;
  padding:18px;
  margin-bottom:15px;
  line-height:1.7;
}

.address-title{
  font-size:18px;
  font-weight:bold;
  color:#6b421f;
  margin-bottom:8px;
}

.address-name{
  font-size:16px;
  font-weight:bold;
}

.active{
  border:2px solid #b8860b;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.btn{
  display:block;
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#b8860b;
  color:white;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  font-size:15px;
}

.delete-btn{
  background:#8b2e2e;
}

.select-btn{
  background:#6b421f;
}

</style>

</head>


<body>


<header>

  <a href="profile.html">
    👤 My Profile
  </a>

  <a href="index.html">
    🏠 Home
  </a>

</header>


<div class="container">

  <div class="card">

    <h2>
      📍 Saved Addresses
    </h2>

    <div id="addressContainer">
    </div>

    <a
      href="index.html"
      class="btn">

      ➕ Add New Address

    </a>

  </div>

</div>


<script>

/* =========================
   LOAD SAVED ADDRESSES
========================= */

function loadAddress(){

  const container =
    document.getElementById(
      "addressContainer"
    );


  let addresses = [];


  /* NEW MULTIPLE ADDRESS LIST */

  const multipleData =
    localStorage.getItem(
      "psmart-addresses"
    );


  if(multipleData){

    try{

      const parsed =
        JSON.parse(multipleData);

      if(Array.isArray(parsed)){

        addresses = parsed;

      }

    }catch(error){

      console.error(error);

    }

  }


  /* OLD SINGLE ADDRESS SUPPORT */

  if(addresses.length === 0){

    const oldData =
      localStorage.getItem(
        "psmart-address"
      );


    if(oldData){

      try{

        const oldAddress =
          JSON.parse(oldData);

        addresses = [
          oldAddress
        ];

      }catch(error){

        console.error(error);

      }

    }

  }


  if(addresses.length === 0){

    container.innerHTML = `

      <div class="empty">

        📍<br><br>

        No saved address found.

        <br><br>

        Add your delivery address
        from the location option.

      </div>

    `;

    return;

  }


  /* =========================
     CURRENT ACTIVE ADDRESS
  ========================= */

  let activeAddress = null;


  const activeData =
    localStorage.getItem(
      "psmart-address"
    );


  if(activeData){

    try{

      activeAddress =
        JSON.parse(activeData);

    }catch(error){

      activeAddress = null;

    }

  }


  container.innerHTML = "";


  addresses.forEach(
    function(address,index){

      const box =
        document.createElement(
          "div"
        );


      box.className =
        "address-box";


      /* Check active address */

      if(
        activeAddress &&
        address.id &&
        activeAddress.id === address.id
      ){

        box.classList.add(
          "active"
        );

      }


      const type =
        address.type ||
        "Other";


      box.innerHTML = `

        <div class="address-title">

          ${
            type === "Home"
            ? "🏠"
            : type === "Work"
            ? "🏢"
            : "📍"
          }

          ${type}

        </div>


        <div class="address-name">

          👤 ${address.name || "Customer"}

        </div>


        <div>

          📞 ${address.phone || "Not added"}

        </div>


        <br>


        <div>

          ${address.address || ""}

          <br>

          ${address.city || ""}

          ${address.pincode || ""}

          <br>

          ${address.state || ""}

        </div>


        ${
          activeAddress &&
          address.id &&
          activeAddress.id === address.id

          ? `

            <button
              class="btn"
              disabled
              style="opacity:.7;">

              ✓ Selected Address

            </button>

          `

          : `

            <button
              class="btn select-btn"
              onclick="selectAddress(${index})">

              ✓ Use This Address

            </button>

          `
        }


        <button
          class="btn delete-btn"
          onclick="deleteAddress(${index})">

          🗑️ Remove Address

        </button>

      `;


      container.appendChild(
        box
      );

    }
  );

}


/* =========================
   SELECT ADDRESS
========================= */

function selectAddress(index){

  const data =
    localStorage.getItem(
      "psmart-addresses"
    );


  if(!data){

    return;

  }


  let addresses;


  try{

    addresses =
      JSON.parse(data);

  }catch(error){

    return;

  }


  if(
    !Array.isArray(addresses) ||
    !addresses[index]
  ){

    return;

  }


  const selected =
    addresses[index];


  localStorage.setItem(
    "psmart-address",
    JSON.stringify(
      selected
    )
  );


  alert(
    "✓ Delivery address selected!"
  );


  loadAddress();

}


/* =========================
   DELETE ADDRESS
========================= */

function deleteAddress(index){

  const confirmDelete =
    confirm(
      "Are you sure you want to remove this address?"
    );


  if(!confirmDelete){

    return;

  }


  let addresses = [];


  const data =
    localStorage.getItem(
      "psmart-addresses"
    );


  if(data){

    try{

      addresses =
        JSON.parse(data);

    }catch(error){

      addresses = [];

    }

  }


  if(!Array.isArray(addresses)){

    addresses = [];

  }


  const deleted =
    addresses[index];


  addresses.splice(
    index,
    1
  );


  localStorage.setItem(
    "psmart-addresses",
    JSON.stringify(
      addresses
    )
  );


  /* If deleted address was active */

  const activeData =
    localStorage.getItem(
      "psmart-address"
    );


  if(activeData){

    try{

      const active =
        JSON.parse(activeData);


      if(
        deleted &&
        active.id &&
        deleted.id === active.id
      ){

        localStorage.removeItem(
          "psmart-address"
        );

      }

    }catch(error){

      console.error(error);

    }

  }


  loadAddress();

}


/* =========================
   START
========================= */

loadAddress();

</script>


</body>

</html>

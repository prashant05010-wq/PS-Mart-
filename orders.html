<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Orders | PS Mart</title>

<link rel="stylesheet" href="style.css">

<style>

.orders-page{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.order-card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:25px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.order-top{
  background:#f7f7f7;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
}

.order-status{
  font-weight:bold;
  text-transform:capitalize;
}

.status-placed{color:#2874f0;}
.status-confirmed{color:#2874f0;}
.status-packed{color:#9c27b0;}
.status-shipped{color:#ff9800;}
.status-out_for_delivery{color:#e65100;}
.status-delivered{color:#008000;}
.status-cancelled{color:#d32f2f;}

.order-body{
  padding:20px;
}

.product-row{
  display:flex;
  gap:20px;
  align-items:center;
  padding-bottom:20px;
  margin-bottom:20px;
  border-bottom:1px solid #eee;
}

.product-image{
  width:110px;
  height:110px;
  border:1px solid #eee;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 8px;
}

.product-info p{
  margin:5px 0;
}

.price{
  font-size:20px;
  font-weight:bold;
}

.order-summary{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-top:20px;
}

.address{
  flex:1;
  min-width:250px;
}

.total{
  min-width:180px;
}

.total h2{
  margin:0;
}

/* SELLER SHIPMENT */

.seller-shipment{
  margin-top:25px;
  padding:20px;
  background:#fafafa;
  border:1px solid #eee;
  border-radius:8px;
}

.seller-shipment h3{
  margin-top:0;
}

.seller-status{
  font-weight:bold;
  text-transform:capitalize;
  margin-bottom:15px;
}

/* TRACKING */

.tracking{
  margin-top:20px;
  padding:18px;
  background:#fff;
  border-radius:8px;
  border:1px solid #eee;
}

.tracking h4{
  margin:0 0 15px;
}

.timeline{
  display:flex;
  justify-content:space-between;
  position:relative;
  margin:25px 10px 10px;
}

.timeline:before{
  content:"";
  position:absolute;
  top:15px;
  left:5%;
  right:5%;
  height:3px;
  background:#ddd;
  z-index:0;
}

.step{
  position:relative;
  z-index:1;
  text-align:center;
  width:20%;
}

.circle{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#ddd;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-weight:bold;
}

.step.done .circle{
  background:#008000;
  color:white;
}

.step span{
  display:block;
  margin-top:8px;
  font-size:13px;
}

.track-note{
  margin-top:18px;
  font-size:14px;
  color:#555;
}

.tracking-info{
  margin-top:12px;
  padding:10px;
  background:#f7f7f7;
  border-radius:6px;
  font-size:14px;
}

/* EMPTY */

.empty-orders{
  text-align:center;
  padding:60px 20px;
  background:#fff;
  border-radius:10px;
  border:1px solid #ddd;
}

.empty-orders h2{
  margin-bottom:10px;
}

.loading{
  text-align:center;
  padding:50px;
}

/* MOBILE */

@media(max-width:600px){

  .product-row{
    align-items:flex-start;
  }

  .product-image{
    width:80px;
    height:80px;
  }

  .timeline{
    margin-left:0;
    margin-right:0;
  }

  .timeline:before{
    left:10%;
    right:10%;
  }

  .step span{
    font-size:10px;
  }

  .circle{
    width:26px;
    height:26px;
    font-size:12px;
  }

}

</style>

</head>


<body>

<header class="header">

  <a class="logo" href="index.html">
    🛍️ <b>PS</b> Mart
  </a>

</header>


<main class="orders-page">

<h1>My Orders</h1>

<div id="orders">

  <div class="loading">
    Loading your orders...
  </div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>
<script src="app.js"></script>


<script>

/* =========================
   STATUS ORDER
========================= */

const STATUS_LIST = [
  "placed",
  "confirmed",
  "packed",
  "shipped",
  "out_for_delivery",
  "delivered"
];


/* =========================
   FORMAT STATUS
========================= */

function formatStatus(status){

  return String(status || "placed")
    .replaceAll("_"," ")
    .replace(/\b\w/g, c => c.toUpperCase());

}


/* =========================
   STATUS ICON
========================= */

function statusLabel(status){

  switch(status){

    case "confirmed":
      return "✓ Confirmed";

    case "packed":
      return "📦 Packed";

    case "shipped":
      return "🚚 Shipped";

    case "out_for_delivery":
      return "🛵 Out for Delivery";

    case "delivered":
      return "✓ Delivered";

    case "cancelled":
      return "✕ Cancelled";

    default:
      return "📦 Order Placed";

  }

}


/* =========================
   TRACKING
========================= */

function tracking(status){

  status =
    String(status || "placed")
    .toLowerCase()
    .replaceAll(" ","_");


  if(status === "cancelled"){

    return `

      <div class="tracking">

        <h4>🚚 Order Tracking</h4>

        <div class="track-note"
             style="color:#d32f2f;font-weight:bold;">

          ❌ This shipment has been cancelled.

        </div>

      </div>

    `;

  }


  let current =
    STATUS_LIST.indexOf(status);


  if(current < 0){
    current = 0;
  }


  const labels = [
    "Ordered",
    "Confirmed",
    "Packed",
    "Shipped",
    "Out for Delivery",
    "Delivered"
  ];


  return `

    <div class="tracking">

      <h4>🚚 Shipment Tracking</h4>

      <div class="timeline">

        ${labels.map((label,index) => `

          <div class="step ${
            current >= index ? "done" : ""
          }">

            <div class="circle">

              ${
                current >= index
                ? "✓"
                : index + 1
              }

            </div>

            <span>${label}</span>

          </div>

        `).join("")}

      </div>

      <div class="track-note">

        Current Status:
        <b>${formatStatus(status)}</b>

      </div>

    </div>

  `;

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const box =
    document.getElementById("orders");


  box.innerHTML = `
    <div class="loading">
      Loading your orders...
    </div>
  `;


 const {
  data: sessionData,
  error: sessionError
} = await supabaseClient.auth.getSession();

const user =
  sessionData &&
  sessionData.session
    ? sessionData.session.user
    : null;

if (sessionError) {
  console.log("Session error:", sessionError);
}


  if(!user){

    box.innerHTML = `

      <div class="empty-orders">

        <h2>🔐 Please Login</h2>

        <p>
          Login to see your orders.
        </p>

        <br>

        <a
          class="goldbtn"
          href="login.html">

          Login

        </a>

      </div>

    `;

    return;

  }


  /* =========================
     ORDERS
  ========================= */

  const {
    data:orders,
    error:orderError
  } =
    await supabaseClient
    .from("orders")
    .select("*")
    .eq("customer_id",user.id)
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(orderError){

    console.log(
      "Orders error:",
      orderError
    );

    box.innerHTML = `

      <div class="empty-orders">

        <h2>
          Unable to load orders
        </h2>

        <p>
          ${orderError.message}
        </p>

      </div>

    `;

    return;

  }


  if(!orders || !orders.length){

    box.innerHTML = `

      <div class="empty-orders">

        <h2>
          🛒 No Orders Yet
        </h2>

        <p>
          You haven't placed any order yet.
        </p>

        <br>

        <a
          class="goldbtn"
          href="products.html">

          Start Shopping

        </a>

      </div>

    `;

    return;

  }


  /* =========================
     ORDER IDS
  ========================= */

  const orderIds =
    orders.map(
      order => order.id
    );


  /* =========================
     ORDER ITEMS
  ========================= */

  const {
    data:items,
    error:itemError
  } =
    await supabaseClient
    .from("order_items")
    .select("*")
    .in("order_id",orderIds);


  if(itemError){

    console.log(
      "Order items error:",
      itemError
    );

  }


  /* =========================
     PRODUCTS
  ========================= */

  const productIds =
    (items || []).map(
      item => item.product_id
    );


  let products = [];


  if(productIds.length){

    const {
      data:productData
    } =
      await supabaseClient
      .from("products")
      .select("*")
      .in("id",productIds);


    products =
      productData || [];

  }


  /* =========================
     SELLER ORDERS
  ========================= */

  const {
    data:sellerOrders,
    error:sellerOrderError
  } =
    await supabaseClient
    .from("seller_orders")
    .select("*")
    .in("order_id",orderIds);


  if(sellerOrderError){

    console.log(
      "Seller orders error:",
      sellerOrderError
    );

  }


  /* =========================
     CREATE ORDER CARDS
  ========================= */

  box.innerHTML =
    orders.map(order => {


      const orderItems =
        (items || [])
        .filter(
          item =>
            String(item.order_id) ===
            String(order.id)
        );


      /* =========================
         PRODUCTS HTML
      ========================= */

      const productHTML =
        orderItems.map(item => {


          const product =
            products.find(
              p =>
                String(p.id) ===
                String(item.product_id)
            );


          if(!product){
            return "";
          }


          const qty =
            Number(item.quantity || 1);


          const price =
            Number(item.price || 0);


          return `

            <div class="product-row">

              <div class="product-image">

                ${
                  product.image_url

                  ?

                  `

                  <img
                    src="${product.image_url}"
                    alt="${product.name}"
                  >

                  `

                  :

                  "🛍️"

                }

              </div>


              <div class="product-info">

                <h3>
                  ${product.name}
                </h3>

                <p>
                  Quantity:
                  <b>${qty}</b>
                </p>

                <p class="price">
                  ₹${price.toLocaleString("en-IN")}
                </p>

              </div>

            </div>

          `;

        }).join("");


      /* =========================
         SELLER SHIPMENTS
      ========================= */

      const orderSellerOrders =
        (sellerOrders || [])
        .filter(
          so =>
            String(so.order_id) ===
            String(order.id)
        );


      let sellerHTML = "";


      if(orderSellerOrders.length){

        sellerHTML =
          orderSellerOrders.map(so => {

            return `

              <div class="seller-shipment">

                <h3>
                  🏪 Seller Shipment
                </h3>

                <div class="
                  seller-status
                  status-${so.status}
                ">

                  ${statusLabel(so.status)}

                </div>

                ${
                  so.tracking_number

                  ?

                  `<div class="tracking-info">
                    📦 Tracking Number:
                    <b>${so.tracking_number}</b>
                  </div>`

                  :

                  ""
                }

                ${
                  so.shipping_provider

                  ?

                  `<div class="tracking-info">
                    🚚 Shipping Provider:
                    <b>${so.shipping_provider}</b>
                  </div>`

                  :

                  ""
                }

                ${tracking(so.status)}

              </div>

            `;

          }).join("");

      }
      else{

        sellerHTML = `

          <div class="seller-shipment">

            <h3>
              🏪 Seller Shipment
            </h3>

            ${tracking("placed")}

          </div>

        `;

      }


      /* =========================
         DATE
      ========================= */

      const date =
        order.created_at

        ?

        new Date(
          order.created_at
        ).toLocaleString("en-IN")

        :

        "Date not available";


      /* =========================
         CARD
      ========================= */

      return `

        <div class="order-card">


          <div class="order-top">

            <div>

              <div class="order-id">
                Order ID: ${order.id}
              </div>

              <small>
                ${date}
              </small>

            </div>


            <div class="order-status">

              📦 Order

            </div>

          </div>


          <div class="order-body">

            ${productHTML}


            <div class="order-summary">

              <div class="address">

                <h3>
                  📍 Delivery Address
                </h3>

                <p>
                  ${order.address || "Not available"}
                </p>

              </div>


              <div class="total">

                <p>
                  Payment
                </p>

                <h2>
                  ₹${Number(
                    order.total_amount || 0
                  ).toLocaleString("en-IN")}
                </h2>

                <small>
                  Total Amount
                </small>

              </div>

            </div>


            <!-- SELLER TRACKING -->

            ${sellerHTML}


            ${
              String(order.status).toLowerCase() ===
              "placed"

              ?

              `

              <div style="margin-top:20px;">

                <button
                  onclick="cancelOrder(${order.id})"
                  style="
                    background:#d32f2f;
                    color:white;
                    border:none;
                    padding:12px 22px;
                    border-radius:6px;
                    cursor:pointer;
                    font-weight:bold;
                  ">

                  ❌ Cancel Order

                </button>

              </div>

              `

              :

              ""

            }

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   CANCEL ORDER
========================= */

async function cancelOrder(orderId){

  const confirmCancel =
    confirm(
      "Are you sure you want to cancel this order?"
    );


  if(!confirmCancel){
    return;
  }


  const {
    error
  } =
    await supabaseClient
    .from("orders")
    .update({
      status:"cancelled"
    })
    .eq("id",orderId);


  if(error){

    alert(
      "Unable to cancel order ❌"
    );

    console.log(error);

    return;

  }


  alert(
    "Order cancelled successfully ✅"
  );


  loadOrders();

}


/* =========================
   AUTO REFRESH
   Seller status changes
   will appear automatically
========================= */

loadOrders();

setInterval(
  loadOrders,
  15000
);

</script>

</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Products | PS Mart</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <a class="logo" href="index.html">
    🛍️ <b>PS</b> Mart
  </a>

  <div class="search">
    <input
      id="search"
      placeholder="Search products, brands and more"
    >
    <button onclick="search()">⌕</button>
  </div>

  <div class="headlinks">
    <a href="login.html">♙ Login</a>

    <a href="wishlist.html">♡</a>

    <a href="cart.html">
      🛒 Cart
      <em id="count">0</em>
    </a>
  </div>

</header>


<!-- =========================
     CATEGORY NAVIGATION
========================= -->

<nav>

  <a href="products.html">
    ☰ All Categories
  </a>

  <a href="products.html?cat=1">
    Mobiles
  </a>

  <a href="products.html?cat=3">
    Fashion
  </a>

  <a href="products.html?cat=2">
    Electronics
  </a>

  <a href="products.html?cat=5">
    Home & Kitchen
  </a>

  <a href="products.html?cat=4">
    Beauty
  </a>

  <a href="products.html?cat=6">
    Grocery
  </a>

  <a href="products.html?cat=7">
    Accessories
  </a>

</nav>


<main>

  <!-- =========================
       PAGE HEADER
  ========================= -->

  <div class="pagehead">

    <h1 id="title">
      All Products
    </h1>

    <select id="sort" onchange="renderProducts()">

      <option value="popular">
        Popular
      </option>

      <option value="low">
        Price: Low to High
      </option>

      <option value="high">
        Price: High to Low
      </option>

    </select>

  </div>


  <div class="shop">


    <!-- =========================
         SIDEBAR FILTERS
    ========================= -->

    <aside>

      <h3>
        Filters
      </h3>


      <p>
        Categories
      </p>


      <a href="products.html?cat=1">
        Mobiles
      </a>

      <a href="products.html?cat=2">
        Electronics
      </a>

      <a href="products.html?cat=3">
        Fashion
      </a>

      <a href="products.html?cat=4">
        Beauty
      </a>

      <a href="products.html?cat=5">
        Home
      </a>

      <a href="products.html?cat=6">
        Grocery
      </a>

      <a href="products.html?cat=7">
        Accessories
      </a>


      <hr>


      <p>
        Price
      </p>


      <label>
        <input type="checkbox">
        Under ₹1,000
      </label>


      <label>
        <input type="checkbox">
        ₹1,000–₹5,000
      </label>


      <label>
        <input type="checkbox">
        ₹5,000+
      </label>

    </aside>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <div id="products" class="grid"></div>

  </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <b>
    🛍️ PS Mart
  </b>

  <span>
    Better Products | Better Life
  </span>

</footer>


<!-- =========================
     SCRIPTS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>

<script src="app.js"></script>

</body>
</html>

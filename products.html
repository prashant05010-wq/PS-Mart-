<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Products | PS Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--esp:#24150b;--brown:#43250f;--gold:#f0bd50;--gdeep:#c9922e;--gsoft:#f7dd9b;--cream:#fbf6ea;--page:#f6f1e7;--ink:#2a1a0e;--muted:#7c6a58;--line:#e6dac3;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,"Segoe UI",Arial,sans-serif;
--ggrad:linear-gradient(135deg,#f7dd9b,#f0bd50 45%,#c9922e);--bgrad:linear-gradient(110deg,#24150b,#43250f 55%,#6c3e17)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:var(--sans);color:var(--ink);padding-bottom:70px}
button,input,select{font-family:inherit}
.pm-head{background:var(--bgrad);color:#fff;padding:12px 4%;display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--gdeep);box-shadow:0 4px 18px rgba(36,21,11,.35)}
.pm-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font:700 28px var(--serif);white-space:nowrap}
.pm-logo i{width:42px;height:42px;border-radius:50%;background:var(--ggrad);color:var(--esp);display:flex;align-items:center;justify-content:center;font:700 20px var(--serif);font-style:normal;box-shadow:0 0 0 3px rgba(240,189,80,.3)}
.pm-search{flex:1;max-width:700px;display:flex;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--gdeep)}
.pm-search input{flex:1;border:0;outline:0;padding:13px 16px;font-size:15px;color:var(--ink)}
.pm-search button{width:56px;border:0;background:var(--ggrad);font-size:20px;cursor:pointer}
.pm-links{display:flex;align-items:center;gap:20px;white-space:nowrap}
.pm-links a{color:#fff;text-decoration:none;font-weight:600;font-size:14px}.pm-links a:hover{color:var(--gold)}
#count{font-style:normal;background:var(--gold);color:var(--esp);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700}
.pm-nav{background:#fff;display:flex;gap:6px;overflow-x:auto;padding:10px 4%;border-bottom:1px solid var(--line);scrollbar-width:none}
.pm-nav::-webkit-scrollbar{display:none}
.pm-nav a{flex-shrink:0;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;padding:8px 14px;border-radius:20px;border:1px solid transparent}
.pm-nav a:hover{background:var(--cream);border-color:var(--gsoft)}
.pm-nav a.on{background:var(--brown);color:var(--gold)}
.pm-wrap{max-width:1400px;margin:auto;padding:16px 4%}
.pm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pm-top h1{margin:0;font:700 32px var(--serif);color:var(--brown)}
.pm-top small{color:var(--muted);font-size:13px}
#sort{padding:10px 14px;border:1px solid var(--gdeep);border-radius:8px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
.pm-shop{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.pm-side{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:84px}
.pm-side h3{margin:0 0 12px;font:700 22px var(--serif);color:var(--brown)}
.pm-side p{margin:14px 0 8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.pm-side a{display:block;padding:7px 0;color:var(--ink);text-decoration:none;font-size:14px}
.pm-side a:hover,.pm-side a.on{color:var(--gdeep);font-weight:700}
.pm-side hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pm-side label{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px;cursor:pointer}
.pm-side input[type=checkbox]{width:17px;height:17px;accent-color:var(--brown)}
.pm-clear{margin-top:10px;width:100%;padding:9px;border:1px solid var(--gdeep);background:var(--cream);color:var(--brown);border-radius:8px;font-weight:700;cursor:pointer}
#products.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#products .product{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;transition:.25s;min-width:0}
#products .product:hover{transform:translateY(-4px);border-color:var(--gdeep);box-shadow:0 12px 26px rgba(67,37,15,.16)}
#products .pic{height:180px;background:var(--cream);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
#products small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
#products h3{margin:4px 0 0;font-size:14px;font-weight:600;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#products b{color:var(--brown)}
#products .product>a[href="coupons.html"]{font-size:12px!important;padding:7px 8px!important}
#products .goldbtn{display:block;text-align:center;text-decoration:none;background:var(--brown);color:var(--gold);padding:10px;border-radius:6px;font-size:13px;font-weight:700;margin-top:auto}
#products .goldbtn:hover{background:var(--ggrad);color:var(--esp)}
#products .empty{grid-column:1/-1;padding:40px 20px;text-align:center;background:#fff;border:1px dashed var(--gdeep);border-radius:12px;color:var(--muted)}
.pm-foot{background:var(--esp);color:#d9ccb7;margin-top:35px;padding:26px 6%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:3px solid var(--gdeep);font-size:14px}
.pm-foot b{font:700 22px var(--serif);color:var(--gold)}
.pm-mnav{display:none}
@media(max-width:1100px){#products.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.pm-shop{grid-template-columns:1fr}.pm-side{position:static;padding:14px}.pm-cats{display:none}
.pm-prices{display:flex;flex-wrap:wrap;gap:6px 16px}#products.grid{grid-template-columns:repeat(2,1fr);gap:10px}#products .pic{height:140px}}
@media(max-width:700px){
.pm-head{padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px}.pm-logo{font-size:0}.pm-search{height:40px}.pm-search input{padding:10px;font-size:14px}.pm-search button{width:45px}.pm-links{display:none}
.pm-wrap{padding:12px 10px}.pm-top h1{font-size:25px}
.pm-mnav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);bottom:0;left:0;right:0;height:65px;padding-bottom:env(safe-area-inset-bottom,0);background:var(--esp);border-top:2px solid var(--gdeep);z-index:2000}
.pm-mnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cdbda3;text-decoration:none;font-size:11px;gap:3px}
.pm-mnav a.on{color:var(--gold);font-weight:700}.pm-mnav span{font-size:24px;line-height:25px}.pm-foot{display:none}}
</style>
</head>
<body>

<div class="pm-head" role="banner">
  <a class="pm-logo" href="index.html"><i>PS</i><span>PS Mart</span></a>
  <div class="pm-search">
    <input id="search" placeholder="Search products, brands and more" onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()" aria-label="Search">🔍</button>
  </div>
  <div class="pm-links">
    <a href="login.html">👤 Login</a>
    <a href="wishlist.html">♡</a>
    <a href="cart.html">🛒 Cart <em id="count">0</em></a>
  </div>
</div>

<div class="pm-nav" id="pmNav">
  <a href="products.html" data-cat="">☰ All Categories</a>
  <a href="products.html?cat=1" data-cat="1">Mobiles</a>
  <a href="products.html?cat=3" data-cat="3">Fashion</a>
  <a href="products.html?cat=2" data-cat="2">Electronics</a>
  <a href="products.html?cat=5" data-cat="5">Home &amp; Kitchen</a>
  <a href="products.html?cat=4" data-cat="4">Beauty</a>
  <a href="products.html?cat=6" data-cat="6">Grocery</a>
  <a href="products.html?cat=7" data-cat="7">Accessories</a>
</div>

<div class="pm-wrap">

  <div class="pm-top">
    <div><h1 id="title">All Products</h1><small id="resultCount"></small></div>
    <select id="sort" onchange="renderProducts()">
      <option value="popular">Popular</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <div class="pm-shop">

    <div class="pm-side">
      <h3>Filters</h3>
      <div class="pm-cats">
        <p>Categories</p>
        <a href="products.html?cat=1" data-cat="1">Mobiles</a>
        <a href="products.html?cat=2" data-cat="2">Electronics</a>
        <a href="products.html?cat=3" data-cat="3">Fashion</a>
        <a href="products.html?cat=4" data-cat="4">Beauty</a>
        <a href="products.html?cat=5" data-cat="5">Home</a>
        <a href="products.html?cat=6" data-cat="6">Grocery</a>
        <a href="products.html?cat=7" data-cat="7">Accessories</a>
        <hr>
      </div>
      <p>Price</p>
      <div class="pm-prices">
        <label><input type="checkbox" class="price-filter" value="0-999" onchange="renderProducts()"> Under ₹1,000</label>
        <label><input type="checkbox" class="price-filter" value="1000-5000" onchange="renderProducts()"> ₹1,000–₹5,000</label>
        <label><input type="checkbox" class="price-filter" value="5001-" onchange="renderProducts()"> ₹5,000+</label>
      </div>
      <button class="pm-clear" onclick="clearPrice()">Clear price filter</button>
    </div>

    <div id="products" class="grid"></div>

  </div>
</div>

<div class="pm-foot"><b>PS Mart</b><span>Better Products | Better Life</span></div>

<div class="pm-mnav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="products.html" class="on"><span>▦</span>Categories</a>
  <a href="profile.html"><span>👤</span>Account</a>
  <a href="cart.html"><span>🛒</span>Cart</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if(typeof window.toggleWishlist!=="function"){window.toggleWishlist=function(id,btn){
  try{var w=JSON.parse(localStorage.getItem("wishlist")||"[]");id=String(id);var i=w.indexOf(id);
  if(i>-1){w.splice(i,1);btn.textContent="♡";}else{w.push(id);btn.textContent="♥";}
  localStorage.setItem("wishlist",JSON.stringify(w));}catch(e){}};}

function clearPrice(){document.querySelectorAll(".price-filter").forEach(function(c){c.checked=false;});renderProducts();}

/* active category highlight */
(function(){
  var cat=new URLSearchParams(location.search).get("cat")||"";
  document.querySelectorAll("[data-cat]").forEach(function(a){if(a.getAttribute("data-cat")===cat&&(cat||a.closest("#pmNav")))a.classList.add("on");});
})();

/* result count (updates after every render) */
(function(){
  var box=document.getElementById("products"),out=document.getElementById("resultCount");
  function upd(){var n=box.querySelectorAll(".product").length;out.textContent=n?("Showing "+n+" product"+(n>1?"s":"")):"";}
  new MutationObserver(upd).observe(box,{childList:true});
})();
</script>
</body>
</html>

}

.language-left{

.language-name{

}

.language-native{

}

.selected{

}

.back-btn{

  text-align:center;
  margin-top:20px;

<script>

<script>

const languageButtons =
  document.querySelectorAll(".language-item");

const savedLanguage =
  localStorage.getItem("psmart-language");


languageButtons.forEach(button => {

  const language =
    button.dataset.language;


  if(language === savedLanguage){

    button.classList.add("selected");

  }


  button.addEventListener("click", function(){

    const selectedLanguage =
      this.dataset.language;


    /* Save selected language */
    localStorage.setItem(
      "psmart-language",
      selectedLanguage
    );


    /* Selected design */
    languageButtons.forEach(btn => {

      btn.classList.remove("selected");

    });

    this.classList.add("selected");


    /* Go to home page */
    setTimeout(function(){

      window.location.href =
        "index.html";

    }, 300);

  });

});

</script>
</script>

<script>
document.querySelectorAll(".language-item").forEach(function(button) {

  button.addEventListener("click", function() {

    const language = this.getAttribute("data-language");

    localStorage.setItem("psmart-language", language);

    alert(language + " selected");

    setTimeout(function() {
      window.location.href = "index.html";
    }, 500);

  });

});

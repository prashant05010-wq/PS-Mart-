<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language | PS Mart</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--esp:#24150b;--brown:#43250f;--gold:#f0bd50;--gdeep:#c9922e;--cream:#fbf6ea;--line:#e6dac3;--muted:#7c6a58;--ggrad:linear-gradient(135deg,#f7dd9b,#f0bd50 45%,#c9922e)}
*{box-sizing:border-box}
body{margin:0;background:#f6f1e7;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#2a1a0e}
.lang-top{background:linear-gradient(110deg,#24150b,#43250f 55%,#6c3e17);padding:14px 4%;border-bottom:2px solid var(--gdeep)}
.lang-top a{color:#fff;text-decoration:none;font:700 26px Georgia,serif}
.language-page{max-width:620px;margin:30px auto;padding:0 16px}
.language-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(67,37,15,.12)}
.language-box h1{margin:0;text-align:center;font:700 32px Georgia,serif;color:var(--brown)}
.language-box p{text-align:center;color:var(--muted);margin:6px 0 0}
.language-list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.language-item{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-family:inherit;text-align:left;transition:.2s}
.language-item:hover{background:var(--cream);border-color:var(--gdeep)}
.language-left{display:flex;align-items:center;gap:12px}
.language-name{font-weight:700;color:var(--brown)}
.language-native{color:var(--muted);font-size:14px}
.language-item.selected{border:2px solid var(--gdeep);background:#fff4d8}
.language-item.selected .tick{color:#188038;font-weight:700}
.back-btn{display:block;text-align:center;margin-top:20px;text-decoration:none;color:var(--brown);font-weight:700}
</style>
</head>
<body>

<div class="lang-top"><a href="index.html">PS Mart</a></div>

<main class="language-page">
  <div class="language-box">
    <h1>🌐 Select Language</h1>
    <p>Choose your preferred language</p>
    <div class="language-list" id="languageList"></div>
    <a href="profile.html" class="back-btn">← Back to Profile</a>
  </div>
</main>

<script>
var LANGS=[
["English","🇬🇧","English"],["Hindi","🇮🇳","हिन्दी"],["Bengali","🇮🇳","বাংলা"],["Marathi","🇮🇳","मराठी"],
["Telugu","🇮🇳","తెలుగు"],["Tamil","🇮🇳","தமிழ்"],["Gujarati","🇮🇳","ગુજરાતી"],["Kannada","🇮🇳","ಕನ್ನಡ"],
["Malayalam","🇮🇳","മലയാളം"],["Punjabi","🇮🇳","ਪੰਜਾਬੀ"],["Urdu","🇮🇳","اردو"],["Odia","🇮🇳","ଓଡ଼ିଆ"],
["Assamese","🇮🇳","অসমীয়া"],["French","🇫🇷","Français"],["German","🇩🇪","Deutsch"],["Spanish","🇪🇸","Español"],
["Italian","🇮🇹","Italiano"],["Japanese","🇯🇵","日本語"],["Chinese","🇨🇳","中文"],["Korean","🇰🇷","한국어"]
];
var saved="English";
try{saved=localStorage.getItem("psmart-language")||"English";}catch(e){}
var list=document.getElementById("languageList");
LANGS.forEach(function(l){
  var b=document.createElement("button");
  b.className="language-item"+(l[0]===saved?" selected":"");
  b.setAttribute("data-language",l[0]);
  b.innerHTML='<span class="language-left">'+l[1]+'<span><span class="language-name">'+l[0]+'</span><br><span class="language-native">'+l[2]+'</span></span></span><span class="tick">'+(l[0]===saved?'✓':'›')+'</span>';
  b.addEventListener("click",function(){
    try{localStorage.setItem("psmart-language",l[0]);}catch(e){}
    document.querySelectorAll(".language-item").forEach(function(x){x.classList.remove("selected");});
    b.classList.add("selected");
    setTimeout(function(){window.location.href="index.html";},300);
  });
  list.appendChild(b);
});
</script>
</body>
</html>

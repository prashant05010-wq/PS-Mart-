<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Support Requests | PS Mart</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5eee4;
      color: #3b2415;
    }

    header {
      background: linear-gradient(135deg, #3b1f0f, #704214);
      color: #f7d774;
      padding: 18px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.25);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .top-box {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
    }

    .top-box h2 {
      margin-top: 0;
      color: #5b3218;
    }

    .request {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
      border-left: 5px solid #c99b30;
    }

    .request h3 {
      margin: 0 0 10px;
      color: #5b3218;
    }

    .message {
      background: #faf6f0;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .details {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
    }

    .pending {
      background: #fff0c2;
      color: #8a6500;
    }

    .progress {
      background: #dcecff;
      color: #14579a;
    }

    .resolved {
      background: #d9f5df;
      color: #19713a;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 35px 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      background: #704214;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #ffe1e1;
      color: #a00000;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>🆘 My Support Requests</h1>
  <a href="profile.html" class="back">← Back to Profile</a>
</header>

<div class="container">

  <div class="top-box">
    <h2>My Requests</h2>
    <p>
      Here you can check the status of your support requests.
    </p>
  </div>

  <div id="requestsContainer">
    <div class="loading">Loading your requests...</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://nctscffhnztscczjxhat.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHNjZmZobnp0c2Njemp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDM0MjUsImV4cCI6MjEwNjAxOTQyNX0.1bR1XER2te7enAtKXaRdTqPnsigh3VJyCLXVbPjKKWw";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const container = document.getElementById("requestsContainer");

  function getStatusClass(status) {
    if (status === "Resolved") {
      return "resolved";
    }

    if (status === "In Progress") {
      return "progress";
    }

    return "pending";
  }

  function formatDate(dateString) {
    const date = new Date(dateString);

    return date.toLocaleString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  async function loadRequests() {

    try {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "login.html";
        return;
      }

      const { data, error } = await supabaseClient
        .from("support_requests")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            ❌ Unable to load your support requests.
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty">
            <h2>📭 No Support Requests</h2>
            <p>You have not submitted any support request yet.</p>

            <a href="contact.html">
              Contact Support
            </a>
          </div>
        `;

        return;
      }

      container.innerHTML = "";

      data.forEach(request => {

        const status = request.status || "Pending";

        const card = document.createElement("div");
        card.className = "request";

        card.innerHTML = `
          <h3>🎫 Support Request #${escapeHTML(String(request.id))}</h3>

          <div class="details">
            <strong>Category:</strong>
            ${escapeHTML(request.category)}
            <br>

            <strong>Submitted:</strong>
            ${formatDate(request.created_at)}
          </div>

          <div class="message">
            <strong>Your Message:</strong><br>
            ${escapeHTML(request.message)}
          </div>

          <strong>Status:</strong>

          <div class="status ${getStatusClass(status)}">
            ${
              status === "Resolved"
                ? "🟢 Resolved"
                : status === "In Progress"
                ? "🔵 In Progress"
                : "🟡 Pending"
            }
          </div>
        `;

        container.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error">
          ❌ Something went wrong. Please try again.
        </div>
      `;
    }
  }

  loadRequests();
</script>

</body>
</html>

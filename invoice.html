<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (window.top !== window.self) { window.top.location = window.self.location; }</script>
<title>Invoice | PS Mart</title>
<style>
:root{--esp:#24150b;--brown:#43250f;--gold:#f0bd50;--gdeep:#c9922e;--page:#f6f1e7;--ink:#2a1a0e;--muted:#7c6a58;--line:#e6dac3;--green:#188038}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
.bar{max-width:820px;margin:16px auto 0;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap}
.bar a,.bar button{border:0;background:linear-gradient(135deg,#f7dd9b,#f0bd50 45%,#c9922e);color:var(--esp);padding:11px 18px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.bar a.dark{background:var(--brown);color:var(--gold)}
.sheet{max-width:820px;margin:14px auto 30px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px}
.head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--gdeep);padding-bottom:16px}
.brand{font:700 30px Georgia,serif;color:var(--brown)}
.brand small{display:block;font:400 13px Arial,sans-serif;color:var(--muted)}
.meta{text-align:right;font-size:14px;line-height:1.7}
.meta b{color:var(--brown)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.cols h4{margin:0 0 6px;color:var(--muted);font-size:13px}
.cols p{margin:0;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
th{background:#fbf6ea;text-align:left;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
.r{text-align:right}
.tot{margin:16px 0 0 auto;max-width:320px;font-size:14px}
.tot div{display:flex;justify-content:space-between;padding:5px 0}
.tot .g{color:var(--green)}
.tot .big{border-top:2px solid var(--brown);margin-top:6px;padding-top:10px;font-size:18px;font-weight:700;color:var(--brown)}
.paid{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:14px;font-size:13px;font-weight:700;background:#e7f6ea;color:var(--green)}
.paid.w{background:#fff4d8;color:#8a5a00}
.qrbox{display:flex;align-items:center;gap:14px;margin-top:20px}
.qrbox #qr{width:110px;height:110px}
.qrbox #qr img,.qrbox #qr canvas{width:110px!important;height:110px!important}
.qrbox small{color:var(--muted);font-size:12px;line-height:1.5}
.foot{margin-top:26px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);text-align:center}
#msg{max-width:820px;margin:20px auto;padding:0 12px;text-align:center;font-weight:700;color:var(--muted)}
@media(max-width:600px){.sheet{padding:16px}.cols{grid-template-columns:1fr}.meta{text-align:left}}
@media print{
  body{background:#fff}.bar,#msg{display:none!important}
  .sheet{border:0;margin:0;max-width:none;padding:0;border-radius:0}
  @page{margin:14mm}
}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div class="bar" id="bar" hidden>
  <button onclick="window.print()">🖨️ Print / PDF Download</button>
  <a class="dark" href="javascript:history.back()">← Wapas</a>
</div>
<div id="msg">Invoice load ho raha hai...</div>
<div class="sheet" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
/* ===== Yahan apni details bharein (khaali chhodo to nahi dikhegi) ===== */
var COMPANY = {
  name: "PS Mart",
  tagline: "Online Marketplace",
  gstin: "",          /* jaise: "09ABCDE1234F1Z5" */
  address: "",        /* jaise: "Lucknow, Uttar Pradesh" */
  upi: ""             /* apna UPI ID, jaise "9876543210@ybl". COD order par isi ka payment QR banega */
};

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fail(t){document.getElementById("msg").textContent=t;}

async function loadInvoice(){
  var id=new URLSearchParams(location.search).get("order");
  if(!id){fail("Order ID nahi mili. Link galat hai.");return;}

  var au=await supabaseClient.auth.getUser();
  var user=au.data&&au.data.user;
  if(!user){fail("Pehle login kijiye.");setTimeout(function(){location.href="login.html";},1000);return;}

  var o=await supabaseClient.from("orders").select("*").eq("id",id).maybeSingle();
  if(o.error){fail(o.error.message);return;}
  if(!o.data){fail("Order nahi mila ya aapko ise dekhne ki ijazat nahi hai.");return;}
  var order=o.data;
  var isCustomer=String(order.customer_id)===String(user.id);

  var it=await supabaseClient.from("order_items")
    .select("id, order_id, product_id, seller_id, quantity, price, products(name)")
    .eq("order_id",order.id);
  if(it.error){fail(it.error.message);return;}
  var items=it.data||[];

  /* seller ka sirf apna hissa */
  var seller=null;
  var sl=await supabaseClient.from("sellers").select("id, shop_name, phone").eq("user_id",user.id).maybeSingle();
  var mySeller=sl&&sl.data;
  if(!isCustomer){
    if(!mySeller){fail("Is invoice ko dekhne ki ijazat nahi hai.");return;}
    items=items.filter(function(x){return String(x.seller_id)===String(mySeller.id);});
    seller=mySeller;
  }else if(items[0]){
    var s2=await supabaseClient.from("sellers").select("shop_name").eq("id",items[0].seller_id).maybeSingle();
    seller=s2&&s2.data;
  }
  if(!items.length){fail("Is order me koi item nahi mila.");return;}

  /* customer ka naam */
  var custName="Customer";
  if(isCustomer){
    var pr=await supabaseClient.from("profiles").select("full_name").eq("id",user.id).maybeSingle();
    if(pr.data&&pr.data.full_name) custName=pr.data.full_name;
  }

  var sub=0;
  var rows=items.map(function(x,i){
    var q=Number(x.quantity||1),p=Number(x.price||0),amt=p*q;sub+=amt;
    return '<tr><td>'+(i+1)+'</td><td>'+esc((x.products&&x.products.name)||"Product")+'</td><td class="r">'+q+'</td><td class="r">'+inr(p)+'</td><td class="r">'+inr(amt)+'</td></tr>';
  }).join("");

  var total=isCustomer?Number(order.total_amount||sub):sub;
  var disc=Math.max(0,sub-total);

  var m=String(order.payment_method||""),paid=order.payment_status==="paid"||/gift/i.test(m),cod=/^COD/i.test(m);
  var payTxt=cod?"Cash on Delivery":/^UPI/i.test(m)?"UPI":/^ONLINE/i.test(m)?"Online":/gift/i.test(m)?"Gift Card":(m||"—");
  var status=cod?{t:"Delivery par payment",w:true}:paid?{t:"Paid",w:false}:{t:"Payment baaki",w:true};
  var date=order.created_at?new Date(order.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}):"—";
  var invNo="INV-"+String(order.id).replace(/-/g,"").slice(0,8).toUpperCase();

  document.getElementById("sheet").innerHTML=
    '<div class="head"><div class="brand">'+esc(COMPANY.name)+'<small>'+esc(COMPANY.tagline)+'</small>'
    +(COMPANY.gstin?'<small>GSTIN: '+esc(COMPANY.gstin)+'</small>':'')
    +(COMPANY.address?'<small>'+esc(COMPANY.address)+'</small>':'')+'</div>'
    +'<div class="meta"><b>TAX INVOICE</b><br>Invoice No: <b>'+esc(invNo)+'</b><br>Date: '+esc(date)+'<br>Order ID: #'+esc(order.id)+'</div></div>'
    +'<div class="cols"><div><h4>Bill To / Ship To</h4><p><b>'+esc(custName)+'</b>\n'+esc(order.address||"Address not available")+'</p></div>'
    +'<div><h4>Sold By</h4><p><b>'+esc((seller&&seller.shop_name)||"PS Mart Seller")+'</b>'+((seller&&seller.phone)?'\nPhone: '+esc(seller.phone):'')+'</p>'
    +'<h4 style="margin-top:12px">Payment</h4><p>'+esc(payTxt)+'</p><span class="paid '+(status.w?"w":"")+'">'+status.t+'</span></div></div>'
    +'<div class="tw"><table><thead><tr><th>#</th><th>Product</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="tot"><div><span>Subtotal</span><span>'+inr(sub)+'</span></div>'
    +(disc>0?'<div class="g"><span>Coupon / Discount</span><span>− '+inr(disc)+'</span></div>':'')
    +'<div><span>Delivery</span><span class="g">FREE</span></div>'
    +'<div class="big"><span>Total</span><span>'+inr(total)+'</span></div></div>'
    +'<div class="qrbox"><div id="qr"></div><small id="qrnote"></small></div>'
    +'<div class="foot">Sabhi prices tax samet hain. Ye computer se bana invoice hai, signature ki zarurat nahi.<br>Dhanyavaad, PS Mart se kharidari ke liye!</div>';

  /* QR: COD + UPI ID ho to payment QR, warna order QR */
  var qrText,qrNote;
  if(cod&&COMPANY.upi){
    qrText="upi://pay?pa="+encodeURIComponent(COMPANY.upi)+"&pn="+encodeURIComponent(COMPANY.name)+"&am="+total.toFixed(2)+"&cu=INR&tn="+encodeURIComponent("Order "+invNo);
    qrNote="<b>Payment QR</b><br>"+inr(total)+" pay karne ke liye kisi bhi UPI app se scan karein.";
  }else{
    qrText="PSMART|"+invNo+"|ORDER:"+order.id+"|TOTAL:"+total.toFixed(2);
    qrNote="<b>Order QR</b><br>"+esc(invNo)+"<br>Delivery ke time scan karke order check kiya ja sakta hai.";
  }
  document.getElementById("qrnote").innerHTML=qrNote;
  try{new QRCode(document.getElementById("qr"),{text:qrText,width:110,height:110});}
  catch(e){document.querySelector(".qrbox").style.display="none";}

  document.getElementById("msg").hidden=true;
  document.getElementById("sheet").hidden=false;
  document.getElementById("bar").hidden=false;
  document.title="Invoice "+invNo+" | PS Mart";
}
loadInvoice();
</script>
</body>
</html>

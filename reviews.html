<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (window.top !== window.self) { window.top.location = window.self.location; }</script>
<title>My Reviews | PS Mart</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f0e6;color:#3b2416;font-family:Arial,sans-serif}
header{background:#3b2416;color:#ffd35c;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
header a{color:#ffd35c;text-decoration:none;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{margin:6px 0 4px;font-size:30px}
.sub{color:#7c6a58;margin:0 0 16px;line-height:1.5}
.card{background:#fff;border:1px solid #e6dac3;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:14px}
.pic{width:84px;height:84px;border-radius:10px;background:#fbf6ea;border:1px solid #e6dac3;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;margin:0 0 6px;word-break:break-word}
.stars button{background:none;border:0;font-size:38px;line-height:1;cursor:pointer;color:#d8d0c4;padding:0 2px}
.stars button.on{color:#f0a500}
.lbl{font-weight:700;font-size:14px;min-height:20px;margin:2px 0 8px}
.ok{color:#188038}
textarea{width:100%;min-height:64px;padding:10px;border:1px solid #c9922e;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:0;background:#3b2416;color:#ffd35c;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn.del{background:#fff;color:#c62828;border:1px solid #c62828}
.empty{background:#fff;border:1px dashed #c9922e;border-radius:14px;padding:34px 16px;text-align:center;color:#7c6a58}
#msg{text-align:center;font-weight:700;color:#7c6a58;margin:20px 0}
@media(max-width:480px){.pic{width:64px;height:64px}.stars button{font-size:34px}}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header><span>PS MART</span><a href="profile.html">← Profile</a></header>
<div class="wrap">
  <h1>My Reviews ⭐</h1>
  <p class="sub">Jo products aapko <b>deliver ho chuke hain</b>, unhe bas ⭐ par click karke rate kijiye. Likhna zaroori nahi hai.</p>
  <div id="msg">Loading...</div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
var LABELS=["","😞 Kharab","😐 Theek-thaak","🙂 Accha","😊 Bahut accha","🤩 Shandar!"];
var ITEMS=[],JUST="";

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

async function loadItems(){
  var m=document.getElementById("msg");
  var au=await supabaseClient.auth.getUser();
  if(!au.data||!au.data.user){m.innerHTML='Pehle <a href="login.html">login</a> kijiye.';return;}
  var r=await supabaseClient.rpc("my_review_items");
  if(r.error){m.textContent="Reviews load nahi ho paye. ps-mart-reviews.sql run kiya hai?";console.log(r.error);return;}
  ITEMS=r.data||[];
  m.textContent="";
  draw();
}

function draw(){
  var box=document.getElementById("list");
  if(!ITEMS.length){box.innerHTML='<div class="empty"><h3 style="margin:0 0 6px">Abhi koi product deliver nahi hua</h3>Delivery ke baad product yahan review ke liye aa jayega.</div>';return;}
  box.innerHTML=ITEMS.map(function(x){
    var n=Number(x.rating||0),pid=esc(x.product_id);
    var img=x.image_url&&/^https:\/\//.test(x.image_url)?'<img src="'+esc(x.image_url)+'" alt="">':"🛍️";
    var stars=[1,2,3,4,5].map(function(i){return '<button class="'+(i<=n?"on":"")+'" data-pid="'+pid+'" data-n="'+i+'" onclick="rate(this.dataset.pid,this.dataset.n)" aria-label="'+i+' star">★</button>';}).join("");
    var lbl=JUST===x.product_id?'<span class="ok">✅ Review submit ho gaya: '+LABELS[n]+'</span>':(n?LABELS[n]:"Rating dene ke liye ⭐ dabayein");
    var extra=n?'<textarea id="c-'+pid+'" placeholder="Kuch likhna chahein to yahan likhein (zaroori nahi)">'+esc(x.comment||"")+'</textarea>'
      +'<div class="row"><button class="btn" data-pid="'+pid+'" onclick="saveComment(this.dataset.pid)">💬 Comment save karein</button>'
      +'<button class="btn del" data-pid="'+pid+'" onclick="delRev(this.dataset.pid)">Review hatayein</button></div>':"";
    return '<div class="card"><div class="pic">'+img+'</div><div class="body"><p class="name">'+esc(x.name||"Product")+'</p>'
      +'<div class="stars">'+stars+'</div><div class="lbl">'+lbl+'</div>'+extra+'</div></div>';
  }).join("");
}

function find(pid){return ITEMS.find(function(x){return String(x.product_id)===String(pid);});}

async function rate(pid,n){
  n=Number(n);
  var r=await supabaseClient.rpc("submit_review",{p_product_id:String(pid),p_rating:n,p_comment:null});
  if(r.error||!r.data||r.data.success!==true){alert((r.data&&r.data.message)||(r.error&&r.error.message)||"Review submit nahi hua");return;}
  var it=find(pid);if(it)it.rating=n;JUST=String(pid);draw();
}

async function saveComment(pid){
  var it=find(pid);if(!it||!it.rating)return;
  var t=document.getElementById("c-"+pid).value;
  var r=await supabaseClient.rpc("submit_review",{p_product_id:String(pid),p_rating:Number(it.rating),p_comment:t});
  if(r.error||!r.data||r.data.success!==true){alert((r.data&&r.data.message)||"Save nahi hua");return;}
  it.comment=t;alert("Comment save ho gaya ✅");
}

async function delRev(pid){
  if(!confirm("Apna review hatana hai?"))return;
  var r=await supabaseClient.rpc("delete_my_review",{p_product_id:String(pid)});
  if(r.error){alert("Hata nahi paya");return;}
  var it=find(pid);if(it){it.rating=null;it.comment=null;}JUST="";draw();
}

loadItems();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews | PS Mart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f1e8;
  color:#3b2415;
}

header{
  background:#3b2112;
  color:#ffd66b;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.back{
  color:#ffd66b;
  text-decoration:none;
}

.container{
  max-width:950px;
  margin:25px auto;
  padding:0 15px;
}

h1{
  margin-bottom:7px;
}

.subtitle{
  color:#765b45;
  margin-bottom:20px;
}

.write-btn{
  display:inline-block;
  background:#b8860b;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
  margin-bottom:20px;
}

.review-box{
  background:white;
  border:1px solid #ead7bd;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(80,40,10,.1);
}

.review-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.product-name{
  font-size:19px;
  font-weight:bold;
}

.stars{
  color:#e0a400;
  font-size:20px;
  letter-spacing:2px;
}

.verified{
  color:#247a35;
  font-size:13px;
  font-weight:bold;
  margin-top:7px;
}

.review-title{
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
}

.review-text{
  margin-top:8px;
  line-height:1.6;
  color:#5c4634;
}

.date{
  color:#8a7765;
  font-size:12px;
  margin-top:10px;
}

.actions{
  display:flex;
  gap:9px;
  margin-top:16px;
  flex-wrap:wrap;
}

.actions button{
  border:0;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.edit{
  background:#ead9b9;
}

.delete{
  background:#f8dddd;
  color:#9b2222;
}

.helpful{
  background:#fff2cf;
  color:#805900;
}

.empty{
  text-align:center;
  padding:35px;
  color:#765b45;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:9999;
  padding:15px;
  overflow:auto;
}

.modal-box{
  max-width:550px;
  margin:35px auto;
  background:white;
  padding:24px;
  border-radius:15px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
  cursor:pointer;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d9c8b4;
  border-radius:8px;
  margin-bottom:17px;
  font-size:15px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.rating-stars{
  display:flex;
  gap:4px;
  font-size:35px;
  margin-bottom:5px;
}

.rating-stars span{
  color:#d7d7d7;
  cursor:pointer;
}

.rating-stars span.active{
  color:#e0a400;
}

.submit{
  width:100%;
  border:0;
  background:#b8860b;
  color:white;
  padding:13px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#message{
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#3b2112;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  z-index:10000;
}

@media(max-width:600px){
  .review-top{
    flex-direction:column;
  }

  .container{
    margin-top:20px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    PS MART
  </div>

  <a href="profile.html" class="back">
    ← Profile
  </a>

</header>


<div class="container">

  <h1>My Reviews ⭐</h1>

  <p class="subtitle">
    Share your shopping experience with other customers.
  </p>

  <a href="javascript:void(0)"
     class="write-btn"
     onclick="openForm()">
    ✍ Write a Review
  </a>

  <div id="reviewsList"></div>

</div>


<!-- REVIEW FORM -->

<div id="reviewModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Write a Review ⭐</h2>

      <button class="close"
              onclick="closeForm()">
        ×
      </button>

    </div>


    <label>Product Name</label>

    <input
      id="productName"
      type="text"
      placeholder="Enter product name"
      maxlength="150"
    >


    <label>Your Rating</label>

    <div class="rating-stars"
         id="ratingStars">

      <span onclick="setRating(1)">★</span>
      <span onclick="setRating(2)">★</span>
      <span onclick="setRating(3)">★</span>
      <span onclick="setRating(4)">★</span>
      <span onclick="setRating(5)">★</span>

    </div>

    <input
      type="hidden"
      id="rating"
      value="0"
    >


    <label>Review Title</label>

    <input
      id="reviewTitle"
      type="text"
      placeholder="Example: Very good product"
      maxlength="100"
    >


    <label>Your Review</label>

    <textarea
      id="reviewText"
      placeholder="Tell us about your experience..."
      maxlength="2000"
    ></textarea>


    <button class="submit"
            onclick="submitReview()">
      Submit Review
    </button>

  </div>

</div>


<div id="message"></div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://nctscffhnztscczjxhat.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHNjZmZobnp0c2Njemp4aGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDM0MjUsImV4cCI6MjEwNjAxOTQyNX0.1bR1XER2te7enAtKXaRdTqPnsigh3VJyCLXVbPjKKWw";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================
   CURRENT USER
========================= */

let currentUser = null;
let editingReviewId = null;

/* =========================
   START
========================= */

async function start(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert("Please login first.");

    window.location.href =
      "login.html";

    return;

  }


  currentUser = user;

  loadReviews();

}


/* =========================
   LOAD REVIEWS
========================= */

async function loadReviews(){

  const list =
    document.getElementById("reviewsList");


  list.innerHTML =
    '<div class="review-box">Loading reviews...</div>';


  const {
    data,
    error
  } =
  await supabaseClient

    .from("reviews")

    .select("*")

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    list.innerHTML =
      '<div class="review-box">Unable to load reviews.</div>';

    console.error(error);

    return;

  }


  if(!data || data.length === 0){

    list.innerHTML = `
      <div class="review-box empty">

        <h2>No reviews yet</h2>

        <p style="margin-top:8px;">
          Be the first person to write a review.
        </p>

      </div>
    `;

    return;

  }


  list.innerHTML = "";


  data.forEach(function(review){

    const stars =
      "★".repeat(review.rating)
      +
      "☆".repeat(5 - review.rating);


    const date =
      review.created_at
      ?
      new Date(review.created_at)
      .toLocaleDateString("en-IN")
      :
      "";


    const ownReview =
      currentUser &&
      review.user_id === currentUser.id;


    const card =
      document.createElement("div");

    card.className =
      "review-box";


    card.innerHTML = `

      <div class="review-top">

        <div>

          <div class="product-name">
            ${escapeHTML(review.product_name || "Product")}
          </div>

        </div>

        <div class="stars">
          ${stars}
        </div>

      </div>


      ${
        review.title
        ?
        `<div class="review-title">
          ${escapeHTML(review.title)}
        </div>`
        :
        ""
      }


      <div class="review-text">
        ${escapeHTML(review.review_text || "")}
      </div>


      <div class="date">
        Reviewed on ${date}
      </div>


      ${
        ownReview
        ?
        `
        <div class="actions">

          <button
            class="edit"
            onclick="editReview('${review.id}')">
            ✏ Edit
          </button>

          <button
            class="delete"
            onclick="deleteReview('${review.id}')">
            🗑 Delete
          </button>

        </div>
        `
        :
        ""
      }

    `;


    list.appendChild(card);

  });

}


/* =========================
   OPEN FORM
========================= */

function openForm(){

  document.getElementById(
    "reviewModal"
  ).style.display = "block";

  document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE FORM
========================= */

function closeForm(){

  document.getElementById(
    "reviewModal"
  ).style.display = "none";

  document.body.style.overflow =
    "auto";

}


/* =========================
   RATING
========================= */

function setRating(value){

  document.getElementById(
    "rating"
  ).value = value;


  const stars =
    document.querySelectorAll(
      "#ratingStars span"
    );


  stars.forEach(
    function(star,index){

      if(index < value){

        star.classList.add("active");

      }else{

        star.classList.remove("active");

      }

    }
  );

}


/* =========================
   SUBMIT REVIEW
========================= */

async function submitReview(){

  const productName =
    document.getElementById("productName").value.trim();

  const rating =
    document.getElementById("rating").value;

  const title =
    document.getElementById("reviewTitle").value.trim();

  const reviewText =
    document.getElementById("reviewText").value.trim();

  if(!productName){

    showMessage("Please enter product name.");

    return;
  }

  if(!rating){

    showMessage("Please select a rating.");

    return;
  }

  if(!reviewText){

    showMessage("Please write your review.");

    return;
  }

  /* EDIT EXISTING REVIEW */

  if(editingReviewId){

    const {
      error
    } = await supabaseClient
      .from("reviews")
      .update({

        product_name: productName,
        rating: Number(rating),
        title: title,
        review_text: reviewText

      })
      .eq("id", editingReviewId)
      .eq("user_id", currentUser.id);

    if(error){

      console.error(error);

      showMessage("Review could not be updated.");

      return;
    }

    showMessage("Review updated successfully.");

    editingReviewId = null;

  }

  /* ADD NEW REVIEW */

  else{

    const {
      error
    } = await supabaseClient
      .from("reviews")
      .insert({

        user_id: currentUser.id,
        product_name: productName,
        rating: Number(rating),
        title: title,
        review_text: reviewText

      });

    if(error){

      console.error(error);

      showMessage("Review could not be submitted.");

      return;
    }

    showMessage("Review submitted successfully.");

  }

  document.getElementById("productName").value = "";
  document.getElementById("reviewTitle").value = "";
  document.getElementById("reviewText").value = "";
  document.getElementById("rating").value = "5";
document.querySelector(
  "#reviewModal .submit"
).textContent = "Submit Review";

  closeForm();

  loadReviews();
}
/* =========================
   DELETE
========================= */

async function deleteReview(id){

  if(
    !confirm(
      "Do you want to delete this review?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient

    .from("reviews")

    .delete()

    .eq("id",id)

    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    console.error(error);

    showMessage(
      "Review could not be deleted."
    );

    return;

  }


  showMessage(
    "Review deleted."
  );


  loadReviews();

}


/* =========================
   EDIT
========================= */

async function editReview(id){

  const {
    data,
    error
  } = await supabaseClient
    .from("reviews")
    .select("*")
    .eq("id", id)
    .eq("user_id", currentUser.id)
    .single();

  if(error){

    console.error(error);

    showMessage("Review could not be loaded.");

    return;
  }

  editingReviewId = id;

  document.getElementById("productName").value =
    data.product_name || "";

  document.getElementById("reviewTitle").value =
    data.title || "";

  document.getElementById("reviewText").value =
    data.review_text || "";

  document.getElementById("rating").value =
    data.rating || 5;

  document.querySelector(
  "#reviewModal .submit"
).textContent = "Update Review";
  document.getElementById("reviewModal").style.display =
    "flex";
}

/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const box =
    document.getElementById(
      "message"
    );


  box.innerText = text;

  box.style.display =
    "block";


  setTimeout(
    function(){

      box.style.display =
        "none";

    },
    3000
  );

}


/* =========================
   START
========================= */

start();

</script>

</body>
</html>

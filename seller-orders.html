<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seller Orders | PS Mart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f1e8;
  color:#3b2416;
}

header{
  background:#3b2416;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
}

.back{
  color:white;
  text-decoration:none;
  background:#8b5e34;
  padding:9px 14px;
  border-radius:7px;
}

.container{
  width:92%;
  max-width:1100px;
  margin:25px auto;
}

.top{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.order{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.order h3{
  margin-top:0;
  color:#8b5e34;
}

.row{
  margin:8px 0;
}

.label{
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:15px;
  background:#fff3cd;
  color:#856404;
  font-size:13px;
  margin-top:8px;
}

.status-box{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.status-box label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

.status-select{
  width:100%;
  max-width:350px;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
  background:white;
}

.update-btn{
  margin-top:10px;
  padding:11px 18px;
  border:0;
  border-radius:7px;
  background:#8b5e34;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.update-btn:hover{
  opacity:.9;
}

.update-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.empty{
  background:white;
  padding:35px;
  text-align:center;
  border-radius:12px;
}

#message{
  text-align:center;
  margin:20px 0;
  font-weight:bold;
}

.success{
  color:green;
}

.error{
  color:#d32f2f;
}

.seller-status{
  margin-top:10px;
}

.tracking-box{
  margin-top:15px;
  padding:12px;
  background:#faf7f2;
  border-radius:8px;
  border:1px solid #eee;
}

@media(max-width:600px){

  header{
    padding:15px;
  }

  .container{
    width:94%;
  }

}

</style>

</head>


<body>


<header>

  <h2>🏪 Seller Orders</h2>

  <a
    class="back"
    href="seller-dashboard.html">
    Dashboard
  </a>

</header>


<div class="container">


  <div class="top">

    <h1>Customer Orders</h1>

    <p>
      Manage your customer orders and update delivery status.
    </p>

  </div>


  <div id="message">
    Loading orders...
  </div>


  <div id="orders"></div>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://nctscffhnztscczjxhat.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHNjZmZobnp0c2Njemp4aGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDM0MjUsImV4cCI6MjEwNjAxOTQyNX0.1bR1XER2te7enAtKXaRdTqPnsigh3VJyCLXVbPjKKWw";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATUS LABEL
========================= */

function statusLabel(status){

  switch(status){

    case "confirmed":
      return "✓ Confirmed";

    case "packed":
      return "📦 Packed";

    case "shipped":
      return "🚚 Shipped";

    case "out_for_delivery":
      return "🛵 Out for Delivery";

    case "delivered":
      return "✓ Delivered";

    case "cancelled":
      return "✕ Cancelled";

    default:
      return "📦 Order Placed";

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const message =
    document.getElementById("message");

  const ordersBox =
    document.getElementById("orders");


  message.innerText =
    "Loading orders...";


  const {
    data:{
      user
    },
    error:authError
  } =
    await supabaseClient.auth.getUser();


  if(authError || !user){

    message.innerText =
      "Please login first.";

    return;

  }


  /* =========================
     FIND SELLER
  ========================= */

  const {
    data:seller,
    error:sellerError
  } =
    await supabaseClient

    .from("sellers")

    .select("id")

    .eq(
      "user_id",
      user.id
    )

    .maybeSingle();


  if(sellerError){

    message.innerText =
      sellerError.message;

    return;

  }


  if(!seller){

    message.innerText =
      "Seller account not found.";

    return;

  }


  /* =========================
     SELLER ORDERS
     seller_id = auth.uid()
  ========================= */

  const {
    data:sellerOrders,
    error:sellerOrdersError
  } =
    await supabaseClient

    .from("seller_orders")

    .select("*")

    .eq(
      "seller_id",
      user.id
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(sellerOrdersError){

    console.log(
      "Seller orders error:",
      sellerOrdersError
    );

    message.innerText =
      sellerOrdersError.message;

    return;

  }


  if(
    !sellerOrders ||
    sellerOrders.length === 0
  ){

    message.innerText = "";

    ordersBox.innerHTML = `

      <div class="empty">

        <h2>
          No orders yet
        </h2>

        <p>
          Customer orders will appear here.
        </p>

      </div>

    `;

    return;

  }


  /* =========================
     ORDER IDS
  ========================= */

  const orderIds =
    sellerOrders.map(
      so => so.order_id
    );


  /* =========================
     ORDER ITEMS
  ========================= */

  const {
    data:items,
    error:itemError
  } =
    await supabaseClient

    .from("order_items")

    .select(`
      id,
      order_id,
      product_id,
      seller_id,
      quantity,
      price,
      orders(
        total_amount,
        status,
        address,
        created_at
      ),
      products(
        name
      )
    `)

    .eq(
      "seller_id",
      seller.id
    )

    .in(
      "order_id",
      orderIds
    );


  if(itemError){

    console.log(
      "Order items error:",
      itemError
    );

    message.innerText =
      itemError.message;

    return;

  }


  message.innerText = "";


  /* =========================
     DISPLAY SELLER ORDERS
  ========================= */

  ordersBox.innerHTML =

    sellerOrders.map(so => {


      const orderId =
        so.order_id;


      const orderItems =
        (items || [])
        .filter(
          item =>
            String(item.order_id) ===
            String(orderId)
        );


      const firstItem =
        orderItems[0];


      const order =
        firstItem?.orders || {};


      const currentStatus =
        so.status || "placed";


      /* =========================
         PRODUCTS
      ========================= */

      const productsHTML =

        orderItems.length

        ?

        orderItems.map(item => {

          const product =
            item.products || {};

          return `

            <div
              class="row"
              style="
                padding:10px 0;
                border-bottom:1px solid #eee;
              "
            >

              <span class="label">
                Product:
              </span>

              ${product.name || "Product"}

              &nbsp; × &nbsp;

              <b>
                ${item.quantity || 1}
              </b>

              <br>

              <span class="label">
                Item Amount:
              </span>

              ₹${Number(
                item.price || 0
              ).toLocaleString("en-IN")}

            </div>

          `;

        }).join("")

        :

        `

        <div class="row">
          Product information unavailable.
        </div>

        `;


      /* =========================
         DATE
      ========================= */

      const date =
        order.created_at

        ?

        new Date(
          order.created_at
        ).toLocaleString("en-IN")

        :

        "Date not available";


      /* =========================
         CANCELLED
      ========================= */

      const customerCancelled =
        String(order.status || "")
        .toLowerCase() ===
        "cancelled";


      return `

        <div class="order">


          <h3>
            Order #${orderId}
          </h3>


          <div class="row">

            <span class="label">
              Order Date:
            </span>

            ${date}

          </div>


          <!-- PRODUCTS -->

          ${productsHTML}


          <div class="row">

            <span class="label">
              Order Total:
            </span>

            ₹${Number(
              order.total_amount || 0
            ).toLocaleString("en-IN")}

          </div>


          <div class="row">

            <span class="label">
              Delivery Address:
            </span>

            ${order.address || "Not available"}

          </div>


          <!-- SELLER STATUS -->

          <div class="seller-status">

            <span class="status">

              Current Seller Status:
              ${statusLabel(currentStatus)}

            </span>

          </div>


          ${
            so.tracking_number ||
            so.shipping_provider

            ?

            `

            <div class="tracking-box">

              ${
                so.tracking_number

                ?

                `
                📦 Tracking Number:
                <b>
                  ${so.tracking_number}
                </b>
                <br><br>
                `

                :

                ""
              }

              ${
                so.shipping_provider

                ?

                `
                🚚 Shipping Provider:
                <b>
                  ${so.shipping_provider}
                </b>
                `

                :

                ""
              }

            </div>

            `

            :

            ""

          }


          <!-- STATUS UPDATE -->

          <div class="status-box">


            ${
              customerCancelled

              ?

              `

              <div style="
                padding:12px;
                background:#fdeaea;
                color:#d32f2f;
                border-radius:7px;
                font-weight:bold;
              ">

                ❌ Customer cancelled this order.

              </div>

              `

              :

              currentStatus === "delivered"

              ?

              `

              <div style="
                padding:12px;
                background:#eaf7ea;
                color:#008000;
                border-radius:7px;
                font-weight:bold;
              ">

                ✓ This order has been delivered.

              </div>

              `

              :

              `

              <label>
                Update Order Status
              </label>


              <select
                class="status-select"
                id="status-${so.id}"
              >

                <option
                  value="placed"
                  ${currentStatus === "placed" ? "selected" : ""}
                >
                  📦 Order Placed
                </option>


                <option
                  value="confirmed"
                  ${currentStatus === "confirmed" ? "selected" : ""}
                >
                  ✓ Confirmed
                </option>


                <option
                  value="packed"
                  ${currentStatus === "packed" ? "selected" : ""}
                >
                  📦 Packed
                </option>


                <option
                  value="shipped"
                  ${currentStatus === "shipped" ? "selected" : ""}
                >
                  🚚 Shipped
                </option>


                <option
                  value="out_for_delivery"
                  ${currentStatus === "out_for_delivery" ? "selected" : ""}
                >
                  🛵 Out for Delivery
                </option>


                <option
                  value="delivered"
                  ${currentStatus === "delivered" ? "selected" : ""}
                >
                  ✓ Delivered
                </option>


                <option
                  value="cancelled"
                  ${currentStatus === "cancelled" ? "selected" : ""}
                >
                  ✕ Cancelled
                </option>

              </select>


              <br>


              <button
                class="update-btn"
                id="btn-${so.id}"
                onclick="updateStatus('${so.id}')"
              >

                Update Status

              </button>

              `

            }

          </div>


        </div>

      `;

    }).join("");

}


/* =========================
   UPDATE SELLER STATUS
========================= */

async function updateStatus(sellerOrderId){

  const select =
    document.getElementById(
      "status-" + sellerOrderId
    );


  const button =
    document.getElementById(
      "btn-" + sellerOrderId
    );


  if(!select){

    alert(
      "Status selector not found ❌"
    );

    return;

  }


  const newStatus =
    select.value;


  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    alert(
      "Please login first ❌"
    );

    return;

  }


  if(button){

    button.disabled = true;

    button.innerText =
      "Updating...";

  }


  /* =========================
     IMPORTANT:
     UPDATE seller_orders
     NOT orders
  ========================= */

  const {
    error
  } =
    await supabaseClient

    .from("seller_orders")

    .update({

      status:newStatus,

      updated_at:
        new Date().toISOString()

    })

    .eq(
      "id",
      sellerOrderId
    )

    .eq(
      "seller_id",
      user.id
    );


  if(error){

    console.log(
      "Seller status update error:",
      error
    );


    alert(
      "Status update failed:\n" +
      error.message
    );


    if(button){

      button.disabled = false;

      button.innerText =
        "Update Status";

    }

    return;

  }


  alert(
    "Order status updated successfully ✓"
  );


  await loadOrders();

}


/* =========================
   START
========================= */

loadOrders();

</script>


</body>

</html>

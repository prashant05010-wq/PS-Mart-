<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Orders | PS Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--esp:#24150b;--brown:#43250f;--gold:#f0bd50;--gdeep:#c9922e;--cream:#fbf6ea;--page:#f6f1e7;--ink:#2a1a0e;--muted:#7c6a58;--line:#e6dac3;--green:#188038;--red:#c62828;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,"Segoe UI",Arial,sans-serif;--ggrad:linear-gradient(135deg,#f7dd9b,#f0bd50 45%,#c9922e);--bgrad:linear-gradient(110deg,#24150b,#43250f 55%,#6c3e17)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--page);color:var(--ink)}
header{background:var(--bgrad);color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gdeep);position:sticky;top:0;z-index:50}
header h2{margin:0;font:700 26px var(--serif)}
.back{color:var(--esp);text-decoration:none;background:var(--ggrad);padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px}
.container{width:94%;max-width:1100px;margin:22px auto}
.top{background:#fff;border:1px solid var(--line);padding:20px;border-radius:14px;margin-bottom:16px}
.top h1{margin:0 0 4px;font:700 32px var(--serif);color:var(--brown)}.top p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font:700 28px var(--serif);color:var(--brown)}.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--gdeep);background:#fff;color:var(--brown);border-radius:20px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--brown);color:var(--gold);border-color:var(--brown)}
.order{background:#fff;border:1px solid var(--line);padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px rgba(67,37,15,.06)}
.order h3{margin:0 0 10px;font:700 24px var(--serif);color:var(--brown)}
.row{margin:8px 0;font-size:14px}.label{font-weight:700}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.badge{display:inline-block;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:700}
.b-placed,.b-confirmed{background:#e7efff;color:#1f4fb8}.b-packed{background:#f1e4f7;color:#7b1fa2}
.b-shipped,.b-out_for_delivery{background:#fff0d6;color:#b86500}.b-delivered{background:#e7f6ea;color:var(--green)}.b-cancelled{background:#fdeaea;color:var(--red)}
.paybox{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--cream)}
.paybox.wait{background:#fff4d8;border-color:var(--gdeep)}.paybox.ok{background:#e7f6ea;border-color:#9bd3a6}
.track-box{margin-top:12px;padding:12px;background:var(--cream);border-radius:8px;border:1px solid var(--line);font-size:14px}
.status-box{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.status-box label{display:block;font-weight:700;margin:10px 0 6px;font-size:13px;color:var(--muted)}
.status-box select,.status-box input{width:100%;max-width:380px;padding:11px;border:1px solid var(--gdeep);border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
.btn{margin-top:12px;padding:11px 20px;border:0;border-radius:8px;background:var(--brown);color:var(--gold);cursor:pointer;font-weight:700}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.gold{background:var(--ggrad);color:var(--esp);margin-top:8px}
.note{padding:12px;border-radius:8px;font-weight:700;margin-top:12px}
.note.bad{background:#fdeaea;color:var(--red)}.note.good{background:#e7f6ea;color:var(--green)}
.empty{background:#fff;border:1px dashed var(--gdeep);padding:35px;text-align:center;border-radius:14px}
#message{text-align:center;margin:16px 0;font-weight:700;color:var(--muted)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}header h2{font-size:22px}}
</style>
</head>
<body>

<header>
  <h2>🏪 Seller Orders</h2>
  <a class="back" href="seller-dashboard.html">Dashboard</a>
</header>

<div class="container">
  <div class="top"><h1>Customer Orders</h1><p>Orders dekhiye, payment confirm kijiye aur delivery status update kijiye.</p></div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips"></div>
  <div id="message">Loading orders...</div>
  <div id="orders"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
var DATA = {sellerOrders:[],items:[],user:null,hasPayCols:true};
var FILTER = "all";

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN");}
function statusLabel(s){
  return ({confirmed:"✓ Confirmed",packed:"📦 Packed",shipped:"🚚 Shipped",out_for_delivery:"🛵 Out for Delivery",delivered:"✓ Delivered",cancelled:"✕ Cancelled"})[s]||"📦 Order Placed";
}
function payInfo(o){
  var m=String(o.payment_method||""),utr=o.upi_utr||((m.match(/UTR\s*(\d{12})/)||[])[1])||"";
  if(/^COD/i.test(m)) return {kind:"cod",text:"💵 Cash on Delivery: customer se "+inr(o.total_amount)+" lena hai",utr:""};
  if(/gift/i.test(m)) return {kind:"ok",text:"🎁 Gift Card se paid",utr:""};
  if(/^UPI/i.test(m)) return o.payment_status==="paid"?{kind:"ok",text:"✅ UPI payment confirm ho chuka hai",utr:utr}:{kind:"wait",text:"⏳ UPI payment verify karna baaki hai",utr:utr};
  return {kind:"cod",text:esc(m||"Payment"),utr:""};
}

async function fetchItems(ids,sellerId){
  var base="id, order_id, product_id, seller_id, quantity, price, products(name)";
  var ext="orders(total_amount, status, address, created_at, payment_method, payment_status, upi_utr)";
  var leg="orders(total_amount, status, address, created_at, payment_method)";
  var r=await supabaseClient.from("order_items").select(base+", "+ext).eq("seller_id",sellerId).in("order_id",ids);
  if(r.error&&/column|schema cache/i.test(r.error.message||"")){
    DATA.hasPayCols=false;
    r=await supabaseClient.from("order_items").select(base+", "+leg).eq("seller_id",sellerId).in("order_id",ids);
  }
  return r;
}

async function loadOrders(){
  var msg=document.getElementById("message");
  msg.innerText="Loading orders...";
  var au=await supabaseClient.auth.getUser();
  var user=au.data&&au.data.user;
  if(au.error||!user){msg.innerText="Please login first.";return;}
  DATA.user=user;

  var sl=await supabaseClient.from("sellers").select("id").eq("user_id",user.id).maybeSingle();
  if(sl.error){msg.innerText=sl.error.message;return;}
  if(!sl.data){msg.innerText="Seller account not found.";return;}

  var so=await supabaseClient.from("seller_orders").select("*").eq("seller_id",user.id).order("created_at",{ascending:false});
  if(so.error){console.log("Seller orders error:",so.error);msg.innerText=so.error.message;return;}
  if(!so.data||!so.data.length){
    msg.innerText="";
    document.getElementById("orders").innerHTML='<div class="empty"><h2>Abhi koi order nahi</h2><p>Customer orders yahan dikhenge.</p></div>';
    return;
  }
  var ids=so.data.map(function(x){return x.order_id;});
  var it=await fetchItems(ids,sl.data.id);
  if(it.error){console.log("Order items error:",it.error);msg.innerText=it.error.message;return;}
  DATA.sellerOrders=so.data;DATA.items=it.data||[];
  msg.innerText=DATA.hasPayCols?"":"⚠️ Payment tracking chalu karne ke liye ps-mart-payments.sql Supabase mein run kijiye.";
  renderAll();
}

function renderAll(){
  var s=DATA.sellerOrders;
  var cnt=function(f){return s.filter(f).length;};
  document.getElementById("stats").innerHTML=
    '<div class="stat"><b>'+s.length+'</b><span>Total orders</span></div>'
   +'<div class="stat"><b>'+cnt(function(x){return x.status==="placed"||!x.status;})+'</b><span>Naye</span></div>'
   +'<div class="stat"><b>'+cnt(function(x){return ["confirmed","packed","shipped","out_for_delivery"].indexOf(x.status)>-1;})+'</b><span>Process mein</span></div>'
   +'<div class="stat"><b>'+cnt(function(x){return x.status==="delivered";})+'</b><span>Delivered</span></div>';
  var opts=[["all","Sab"],["new","Naye"],["process","Process mein"],["delivered","Delivered"],["cancelled","Cancelled"]];
  document.getElementById("chips").innerHTML=opts.map(function(o){
    return '<button class="chip '+(FILTER===o[0]?"on":"")+'" onclick="setFilter(\''+o[0]+'\')">'+o[1]+'</button>';}).join("");
  var list=s.filter(function(x){
    var st=x.status||"placed";
    if(FILTER==="new") return st==="placed";
    if(FILTER==="process") return ["confirmed","packed","shipped","out_for_delivery"].indexOf(st)>-1;
    if(FILTER==="delivered") return st==="delivered";
    if(FILTER==="cancelled") return st==="cancelled";
    return true;
  });
  document.getElementById("orders").innerHTML=list.length?list.map(orderBox).join(""):'<div class="empty">Is filter mein koi order nahi.</div>';
}
function setFilter(f){FILTER=f;renderAll();}

function orderBox(so){
  var items=DATA.items.filter(function(i){return String(i.order_id)===String(so.order_id);});
  var order=(items[0]&&items[0].orders)||{};
  var st=so.status||"placed";
  var cancelled=String(order.status||"").toLowerCase()==="cancelled";
  var date=order.created_at?new Date(order.created_at).toLocaleString("en-IN"):"Date not available";
  var prods=items.length?items.map(function(i){
    var p=i.products||{};
    return '<div class="item"><span class="label">Product:</span> '+esc(p.name||"Product")+' &nbsp;×&nbsp; <b>'+Number(i.quantity||1)+'</b><br><span class="label">Item amount:</span> '+inr(i.price)+'</div>';
  }).join(""):'<div class="row">Product information unavailable.</div>';

  var pay=payInfo(order),payHtml='<div class="paybox '+(pay.kind==="wait"?"wait":pay.kind==="ok"?"ok":"")+'"><b>'+pay.text+'</b>'
    +(pay.utr?'<br>UTR number: <b>'+esc(pay.utr)+'</b> <small>(apne bank/UPI app mein check karein)</small>':'');
  if(pay.kind==="wait"&&DATA.hasPayCols&&!cancelled){
    payHtml+='<br><button class="btn gold" id="pay-'+esc(so.id)+'" data-order="'+esc(so.order_id)+'" onclick="confirmPayment(this)">✅ Payment mil gaya, confirm karein</button>';
  }
  payHtml+='</div>';

  var track=(so.tracking_number||so.shipping_provider)?'<div class="track-box">'
    +(so.tracking_number?'📦 Tracking Number: <b>'+esc(so.tracking_number)+'</b><br>':'')
    +(so.shipping_provider?'🚚 Courier: <b>'+esc(so.shipping_provider)+'</b>':'')+'</div>':'';

  var opt=function(v,t){return '<option value="'+v+'" '+(st===v?"selected":"")+'>'+t+'</option>';};
  var action;
  if(cancelled) action='<div class="note bad">❌ Customer ne ye order cancel kar diya.</div>';
  else if(st==="delivered") action='<div class="note good">✓ Ye order deliver ho chuka hai.</div>';
  else action='<label>Order status badlein</label><select id="status-'+esc(so.id)+'">'
    +opt("placed","📦 Order Placed")+opt("confirmed","✓ Confirmed")+opt("packed","📦 Packed")+opt("shipped","🚚 Shipped")
    +opt("out_for_delivery","🛵 Out for Delivery")+opt("delivered","✓ Delivered")+opt("cancelled","✕ Cancelled")+'</select>'
    +'<label>Tracking number (optional)</label><input id="trk-'+esc(so.id)+'" value="'+esc(so.tracking_number||"")+'" placeholder="Jaise: DL1234567890">'
    +'<label>Courier / Shipping partner (optional)</label><input id="prov-'+esc(so.id)+'" value="'+esc(so.shipping_provider||"")+'" placeholder="Jaise: Delhivery, India Post">'
    +'<br><button class="btn" id="btn-'+esc(so.id)+'" data-id="'+esc(so.id)+'" data-payment="'+pay.kind+'" onclick="updateStatus(this)">Status update karein</button>';

  return '<div class="order"><h3>Order #'+esc(so.order_id)+'</h3>'
    +'<div class="row"><span class="label">Order date:</span> '+esc(date)+'</div>'+prods
    +'<div class="row"><span class="label">Order total:</span> '+inr(order.total_amount)+'</div>'
    +'<div class="row"><span class="label">Delivery address:</span> '+esc(order.address||"Not available")+'</div>'
    +'<div style="margin-top:10px"><span class="badge b-'+esc(st)+'">'+statusLabel(st)+'</span></div>'
    +payHtml+track+'<div class="status-box">'+action+'</div></div>';
}

async function confirmPayment(btn){
  if(!confirm("Kya aapne bank / UPI app mein ye payment aate hue dekh liya hai?")) return;
  btn.disabled=true;btn.textContent="Confirm ho raha hai...";
  var r=await supabaseClient.rpc("confirm_upi_payment",{p_order_id:btn.dataset.order});
  var d=r.data;
  if(r.error||!d||d.success!==true){
    console.log(r.error||d);
    alert("Payment confirm nahi ho paya:\n"+((r.error&&r.error.message)||(d&&d.message)||"ps-mart-payments.sql Supabase mein run kiya hai?"));
    btn.disabled=false;btn.textContent="✅ Payment mil gaya, confirm karein";return;
  }
  alert("Payment confirm ho gaya ✓");
  loadOrders();
}

async function updateStatus(btn){
  var id=btn.dataset.id;
  var sel=document.getElementById("status-"+id);
  if(!sel){alert("Status selector not found ❌");return;}
  var newStatus=sel.value;
  if(btn.dataset.payment==="wait"&&["packed","shipped","out_for_delivery","delivered"].indexOf(newStatus)>-1){
    if(!confirm("Is UPI order ka payment abhi verify nahi hua hai. Phir bhi aage badhna hai?")) return;
  }
  var user=(await supabaseClient.auth.getUser()).data.user;
  if(!user){alert("Please login first ❌");return;}
  btn.disabled=true;btn.innerText="Updating...";
  var upd={status:newStatus,updated_at:new Date().toISOString()};
  var trk=(document.getElementById("trk-"+id)||{}).value,prov=(document.getElementById("prov-"+id)||{}).value;
  if(trk&&trk.trim()) upd.tracking_number=trk.trim();
  if(prov&&prov.trim()) upd.shipping_provider=prov.trim();
  var r=await supabaseClient.from("seller_orders").update(upd).eq("id",id).eq("seller_id",user.id);
  if(r.error){
    console.log("Seller status update error:",r.error);
    alert("Status update failed:\n"+r.error.message);
    btn.disabled=false;btn.innerText="Status update karein";return;
  }
  alert("Order status update ho gaya ✓");
  loadOrders();
}

loadOrders();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product | PS Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--esp:#24150b;--brown:#43250f;--gold:#f0bd50;--gdeep:#c9922e;--gsoft:#f7dd9b;--cream:#fbf6ea;--page:#f6f1e7;--ink:#2a1a0e;--muted:#7c6a58;--line:#e6dac3;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,"Segoe UI",Arial,sans-serif;--ggrad:linear-gradient(135deg,#f7dd9b,#f0bd50 45%,#c9922e);--bgrad:linear-gradient(110deg,#24150b,#43250f 55%,#6c3e17)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:var(--sans);color:var(--ink);padding-bottom:70px}
button,input{font-family:inherit}
.pm-head{background:var(--bgrad);color:#fff;padding:12px 4%;display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--gdeep);box-shadow:0 4px 18px rgba(36,21,11,.35)}
.pm-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font:700 28px var(--serif);white-space:nowrap}
.pm-logo i{width:42px;height:42px;border-radius:50%;background:var(--ggrad);color:var(--esp);display:flex;align-items:center;justify-content:center;font:700 20px var(--serif);box-shadow:0 0 0 3px rgba(240,189,80,.3)}
.pm-search{flex:1;max-width:700px;display:flex;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--gdeep)}
.pm-search input{flex:1;border:0;outline:0;padding:13px 16px;font-size:15px;color:var(--ink)}
.pm-search button{width:56px;border:0;background:var(--ggrad);font-size:20px;cursor:pointer}
.pm-links{display:flex;align-items:center;gap:20px;white-space:nowrap}
.pm-links a{color:#fff;text-decoration:none;font-weight:600;font-size:14px}.pm-links a:hover{color:var(--gold)}
#count{font-style:normal;background:var(--gold);color:var(--esp);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700}
.location-bar{background:var(--cream);padding:10px 5%;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.location-bar a{color:var(--brown);font-weight:700;text-decoration:none;border-bottom:1px solid var(--gdeep)}
.pm-wrap{max-width:1400px;margin:auto;padding:20px 4%}
.pm-wrap h1.pm-title{margin:0 0 16px;font:700 34px var(--serif);color:var(--brown)}
.pm-foot{background:var(--esp);color:#d9ccb7;margin-top:35px;padding:26px 6%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:3px solid var(--gdeep);font-size:14px}
.pm-foot b{font:700 22px var(--serif);color:var(--gold)}.pm-foot a{color:#d9ccb7;text-decoration:none;margin-right:16px}.pm-foot a:hover{color:var(--gold)}
.pm-mnav{display:none}
.empty{padding:40px 20px;text-align:center;background:#fff;border:1px dashed var(--gdeep);border-radius:12px;color:var(--muted)}
.goldbtn{display:inline-block;text-decoration:none;background:var(--ggrad);color:var(--esp);padding:12px 22px;border-radius:8px;font-weight:700}
.green{color:#188038;font-weight:700}
@media(max-width:700px){
.pm-head{padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px}.pm-logo{font-size:0}.pm-search{height:40px}.pm-search input{padding:10px;font-size:14px}.pm-search button{width:45px}.pm-links{display:none}
.location-bar{padding:10px 15px;white-space:nowrap;overflow:hidden}.pm-wrap{padding:12px 10px}.pm-wrap h1.pm-title{font-size:26px}
.pm-mnav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);bottom:0;left:0;right:0;height:65px;padding-bottom:env(safe-area-inset-bottom,0);background:var(--esp);border-top:2px solid var(--gdeep);z-index:2000}
.pm-mnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cdbda3;text-decoration:none;font-size:11px;gap:3px}
.pm-mnav a.on{color:var(--gold);font-weight:700}.pm-mnav span{font-size:24px;line-height:25px}.pm-foot{display:none}}

.pm-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
#detail .detail-top{display:grid;grid-template-columns:42% 58%;gap:34px}
#detail .detail-image-box{min-height:430px;background:var(--cream);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
#detail .detail-image-box img{width:100%;height:420px;object-fit:contain}
#detail .detail-info small{color:var(--muted)}
#detail .detail-info h1{font:700 34px var(--serif);margin:6px 0 12px;color:var(--brown);line-height:1.15}
#detail .detail-rating{display:inline-block;background:#388e3c;color:#fff;padding:4px 9px;border-radius:5px;font-size:13px;font-weight:700;margin-right:8px}
#detail .detail-price{font-size:32px;font-weight:700;margin:12px 0;color:var(--brown)}
#detail .detail-price del{font-size:16px;color:#8c7c6a;margin-left:10px;font-weight:400}
#detail .discount{color:#188038;font-size:15px;margin-left:8px;font-weight:700}
#detail .offer-box{background:#fff4d8;border:1px dashed var(--gdeep);border-radius:10px;padding:14px 16px;margin:16px 0}
#detail .offer-box h3,#detail .delivery-box h3{margin:0 0 6px;font:700 22px var(--serif);color:var(--brown)}
#detail .offer{padding:5px 0;font-size:14px}
#detail .delivery-box{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
#detail .delivery-box p{margin:0 0 6px;font-size:14px;color:var(--muted)}
#detail .action-buttons{display:flex;gap:12px;margin:20px 0}
#detail .action-buttons button{flex:1;padding:15px;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
#detail .cart-btn{background:var(--brown);color:var(--gold)}
#detail .buy-btn{background:var(--ggrad);color:var(--esp)}
#detail .action-buttons button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,37,15,.25)}
#detail .info-section{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
#detail .info-section h2{margin:0 0 12px;font:700 28px var(--serif);color:var(--brown)}
#detail .spec-table{width:100%;border-collapse:collapse;max-width:700px}
#detail .spec-table td{padding:11px 14px;border:1px solid var(--line);font-size:14px}
#detail .spec-table td:first-child{background:var(--cream);color:var(--muted);width:35%;font-weight:600}
#detail .seller-box,#detail .review-box{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
#detail .seller-box h3{margin:0 0 6px;color:var(--brown)}#detail .seller-box p,#detail .review-box p{margin:4px 0;font-size:14px}
@media(max-width:800px){#detail .detail-top{grid-template-columns:1fr;gap:18px}#detail .detail-image-box{min-height:300px}#detail .detail-image-box img{height:280px}
#detail .detail-info h1{font-size:26px}#detail .detail-price{font-size:27px}#detail .action-buttons{flex-direction:column}.pm-card{padding:14px}}
</style>
</head>
<body>
<div class="pm-head" role="banner">
  <a class="pm-logo" href="index.html"><i>PS</i><span>PS Mart</span></a>
  <div class="pm-search">
    <input id="search" type="text" placeholder="Search for Products, Brands and More" onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()" aria-label="Search">🔍</button>
  </div>
  <div class="pm-links">
    <a href="login.html">👤 Login</a>
    <a href="seller-register.html">Sell on PS Mart</a>
    <a href="wishlist.html">♡</a>
    <a href="cart.html">🛒 Cart <em id="count">0</em></a>
  </div>
</div>
<div class="location-bar">📍 <span>Delivery location</span>
  <a href="#" onclick="openLocation(); return false;">Select your location →</a>
</div>
<div class="pm-wrap">
  <div id="detail" class="pm-card"><p style="padding:20px;text-align:center;color:#7c6a58">Loading product details...</p></div>
</div>
<div class="pm-foot"><div><b>PS Mart</b><br>Better Products • Better Life</div>
  <div><a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart</a><a href="orders.html">My Orders</a></div></div>
<div class="pm-mnav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="products.html"><span>▦</span>Categories</a>
  <a href="profile.html"><span>👤</span>Account</a>
  <a href="cart.html" class=""><span>🛒</span>Cart</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

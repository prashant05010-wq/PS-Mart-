<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Confirm | PS Mart</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f1e7;color:#2a1a0e;font-family:Inter,"Segoe UI",Arial,sans-serif}
header{background:#43250f;color:#f0bd50;padding:14px 16px;font-weight:700;font-size:18px;border-bottom:2px solid #c9922e}
.box{max-width:480px;margin:14px auto;padding:0 12px 30px}
.card{background:#fff;border:1px solid #e6dac3;border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:#7c6a58}
.row{margin:6px 0;font-size:15px;line-height:1.5;word-break:break-word}
.cod{background:#fff4d8;border:2px dashed #c9922e;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:700;color:#8a5a00}
.pre{background:#e7f6ea;border-radius:12px;padding:12px;text-align:center;font-weight:700;color:#188038}
.bad{background:#fdeaea;color:#c62828;border-radius:12px;padding:14px;font-weight:700;text-align:center}
.ok{background:#e7f6ea;color:#188038;border-radius:12px;padding:26px 14px;font-weight:700;text-align:center;font-size:20px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=text],select{width:100%;padding:14px;border:2px solid #c9922e;border-radius:10px;font-size:20px;background:#fff;color:#2a1a0e}
#otp{letter-spacing:8px;text-align:center;font-size:28px;font-weight:700}
select{font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff4d8;padding:12px;border-radius:10px;font-weight:600}
.chk input{width:22px;height:22px;margin-top:2px}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:#188038;color:#fff}
button.alt{background:#fff;color:#c62828;border:1px solid #c62828}
button:disabled{opacity:.6}
.warn{font-size:13px;color:#7c6a58;margin-top:8px}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header>🚚 PS Mart Delivery</header>
<div class="box" id="box"><div class="card">Loading...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
var CODE=(new URLSearchParams(location.search).get("c")||"").trim();
var BOX=document.getElementById("box");
var CUR=null;

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN");}

async function loadDelivery(){
  if(!CODE){BOX.innerHTML='<div class="bad">Package ke QR code ko scan karke page kholiye.</div>';return;}
  /* NAYA: agar approved Delivery Partner login hai to secure dashboard par bhejo (purana flow neeche waisa hi chalta hai) */
  try{var au=await supabaseClient.auth.getUser();if(au.data&&au.data.user){var me=await supabaseClient.rpc("dp_me");if(me.data&&me.data.exists&&me.data.status==="approved"){location.replace("delivery-dashboard.html?scan="+encodeURIComponent(CODE));return;}}}catch(e){}
  var r=await supabaseClient.rpc("get_delivery_info",{p_code:CODE}),d=r.data;
  if(r.error||!d||d.success!==true){
    BOX.innerHTML='<div class="bad">'+esc((d&&d.message)||(r.error&&r.error.message)||"Order nahi mila")+'</div>';return;
  }
  CUR=d;draw(d);
}

function draw(d){
  var items=(d.items||[]).map(function(i){return esc(i.name||"Product")+" × "+Number(i.qty||1);}).join("<br>");
  var html='<div class="card"><h3>Order #'+esc(d.order_id)+'</h3>'
    +'<div class="row"><b>Bhejne wala:</b> '+esc(d.shop_name||"PS Mart Seller")+'</div>'
    +'<div class="row"><b>Saaman:</b><br>'+(items||"—")+'</div>'
    +'<div class="row"><b>👤 Customer:</b> '+esc(d.customer_name||"Customer")+'</div>'
    +(d.customer_phone?'<div class="row"><a href="tel:'+esc(String(d.customer_phone).replace(/[^\d+]/g,""))+'" style="display:inline-block;background:#43250f;color:#f0bd50;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:700">📞 Call: '+esc(d.customer_phone)+'</a></div>':'<div class="row" style="color:#c62828">📞 Customer ka phone number nahi mila</div>')
    +'<div class="row"><b>📍 Deliver kahan:</b><br>'+esc(d.address||"Address nahi mila")+'</div>'
    +(d.fail_reason?'<div class="row" style="color:#8a5a00">Pichli koshish: '+esc(d.fail_reason)+'</div>':'')
    +'</div>';

  if(d.delivered){
    html+='<div class="ok">✅ Ye order deliver ho chuka hai</div>';
  }else if(d.status==="cancelled"){
    html+='<div class="bad">❌ Ye order cancel ho chuka hai. Delivery mat kijiye.</div>';
  }else if(d.status!=="out_for_delivery"){
    html+='<div class="bad">Order abhi "Out for Delivery" nahi hai. Seller se status badalne ko kahein.</div>';
  }else{
    html+=(d.payment_mode==="COD"
      ?'<div class="cod">💵 Customer se '+inr(d.collect_amount)+' cash lein</div>'
      :'<div class="pre">✅ Payment ho chuka hai. Paisa nahi lena hai</div>');
    html+='<div class="card"><label for="otp">Customer se OTP puchiye</label>'
      +'<input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">'
      +(d.payment_mode==="COD"?'<label class="chk"><input type="checkbox" id="cash"> Maine customer se '+inr(d.collect_amount)+' le liye</label>':'')
      +'<button id="ok" onclick="confirmDelivery()">✅ Delivery Confirm Karein</button>'
      +'<div class="warn">Sirf tab confirm karein jab customer ko saaman de diya ho. Baaki koshishein: '+Number(d.attempts_left)+'</div></div>'
      +'<div class="card"><label for="why">Delivery nahi ho payi?</label><select id="why">'
      +'<option>Customer ghar par nahi tha</option><option>Customer ne lene se mana kiya</option>'
      +'<option>Address nahi mila</option><option>Customer ka phone nahi utha</option><option>Koi aur wajah</option></select>'
      +'<button class="alt" onclick="failDelivery()">Wajah save karein</button></div>';
  }
  BOX.innerHTML=html;
}

async function confirmDelivery(){
  var otp=(document.getElementById("otp").value||"").trim();
  if(!/^\d{6}$/.test(otp)){alert("6 digit ka OTP daaliye.");return;}
  var cash=document.getElementById("cash");
  if(cash&&!cash.checked){alert("Pehle customer se cash lekar box tick kijiye.");return;}
  var b=document.getElementById("ok");b.disabled=true;b.textContent="Check ho raha hai...";
  var r=await supabaseClient.rpc("verify_delivery",{p_code:CODE,p_otp:otp}),d=r.data;
  if(r.error||!d||d.success!==true){
    alert((d&&d.message)||(r.error&&r.error.message)||"Confirm nahi ho paya");
    b.disabled=false;b.textContent="✅ Delivery Confirm Karein";loadDelivery();return;
  }
  BOX.innerHTML='<div class="ok">✅ Delivery confirm ho gayi<br><small>Dhanyavaad!</small></div>';
}

async function failDelivery(){
  var why=document.getElementById("why").value;
  var r=await supabaseClient.rpc("report_failed_delivery",{p_code:CODE,p_reason:why}),d=r.data;
  if(r.error||!d||d.success!==true){alert("Save nahi hua.");return;}
  alert("Wajah save ho gayi. Seller ko dikhegi.");
  loadDelivery();
}

loadDelivery();
</script>
</body>
</html>

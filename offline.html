<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline | PS Mart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F7F1E8;color:#3B2416;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(59,36,22,.12);padding:34px 26px;max-width:380px;width:100%}
.ic{font-size:52px;margin-bottom:10px}
h1{font-size:22px;margin-bottom:8px}
p{font-size:14px;color:#7a6a58;line-height:1.5;margin-bottom:20px}
button{background:#C9922E;color:#fff;border:0;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#a87518}
</style>
</head>
<body>
<div class="card">
  <div class="ic">📡</div>
  <h1>Internet nahi hai</h1>
  <p>Aap abhi offline hain. Internet chalu karke dobara try karein.</p>
  <button type="button" onclick="location.reload()">Retry</button>
</div>
</body>
</html>

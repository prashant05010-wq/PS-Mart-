<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3B2416">
<title>Reset Password | PS Mart</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-auth.css">
<script src="no-zoom.js"></script>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<main class="au-card">
  <div class="au-top"><a class="au-logo" href="index.html" aria-label="PS Mart home"><i>PS</i><b>PS MART</b></a></div>
  <div class="au-body">
    <h1>Set New Password</h1>
    <p id="rsSub" class="au-sub">Link check ho raha hai...</p>
    <div id="rsForm" class="au-hide">
      <div class="au-f"><label for="pw">New Password</label>
        <div class="au-pw"><input class="au-in" id="pw" type="password" autocomplete="new-password" placeholder="Kam se kam 8 akshar">
          <button type="button" class="au-eye" id="pwEye" aria-label="Show password"></button></div>
        <div class="au-hint">8+ akshar, ek letter aur ek number zaruri.</div></div>
      <div class="au-f"><label for="pw2">Confirm New Password</label>
        <div class="au-pw"><input class="au-in" id="pw2" type="password" autocomplete="new-password" placeholder="Password dobara likhein">
          <button type="button" class="au-eye" id="pw2Eye" aria-label="Show password"></button></div></div>
      <button class="au-btn" id="goBtn" type="button">Save Password</button>
    </div>
    <div id="msg" class="au-msg" role="alert"></div>
    <div class="au-foot"><a href="forgot-password.html">Naya reset link mangayein</a> &nbsp;|&nbsp; <a href="login.html">Login</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ps-auth.js"></script>
<script>
(function () {
  var A = PSAuth, sb = A.client, $ = A.$, ready = false, busy = false;
  var hash = location.hash || "";
  var wasRecovery = /type=recovery/.test(hash);
  var hadError = /error(_code|_description)?=/.test(hash);
  A.wireEye("pw", "pwEye"); A.wireEye("pw2", "pw2Eye");

  function openForm() {
    if (ready) return; ready = true;
    $("rsSub").textContent = "Apna naya password likhein.";
    $("rsForm").classList.remove("au-hide");
    A.msg("msg", "", "");
  }
  function bad() {
    $("rsSub").textContent = "";
    A.msg("msg", "Ye link galat ya purana (expire) ho gaya hai. Naya reset link mangwayein.", "bad");
  }

  sb.auth.onAuthStateChange(function (ev) { if (ev === "PASSWORD_RECOVERY") openForm(); });
  setTimeout(async function () {
    if (ready) return;
    if (hadError) return bad();
    try {
      var s = await sb.auth.getSession();
      if (wasRecovery && s.data && s.data.session) return openForm();
    } catch (e) {}
    bad();
  }, 2500);

  async function save() {
    if (busy || !ready) return;
    var pw = $("pw").value, pw2 = $("pw2").value;
    var pp = A.passwordProblem(pw); if (pp) return A.msg("msg", pp, "bad");
    if (pw !== pw2) return A.msg("msg", "Dono password same nahi hain.", "bad");
    busy = true; $("goBtn").disabled = true; A.msg("msg", "Save ho raha hai...", "info");
    try {
      var r = await sb.auth.updateUser({ password: pw });
      if (r.error) { A.msg("msg", A.friendly(r.error), "bad"); busy = false; $("goBtn").disabled = false; return; }
      $("pw").value = ""; $("pw2").value = "";
      A.msg("msg", "Password badal diya gaya. Aapko le ja rahe hain...", "ok");
      var s = await sb.auth.getSession();
      setTimeout(function () {
        if (s.data && s.data.session) A.finishLogin(s.data.session, "msg"); else location.replace("login.html");
      }, 1200);
    } catch (e) { A.msg("msg", A.friendly(e), "bad"); busy = false; $("goBtn").disabled = false; }
  }
  $("goBtn").addEventListener("click", save);
  $("pw2").addEventListener("keydown", function (e) { if (e.key === "Enter") save(); });
})();
</script>
</body>
</html>

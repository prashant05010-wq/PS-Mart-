<!doctype html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RF64CHGYC8"></script>

  function gtag(){dataLayer.push(arguments);}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3B2416">
<title>Login | PS Mart</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-auth.css">
<script src="no-zoom.js"></script>
<meta name="description" content="Log in to your PS Mart account to view orders, wishlist and offers.">
</head>
<body>
<main class="au-card">
  <div class="au-top"><a class="au-logo" href="index.html" aria-label="PS Mart home"><i>PS</i><b>PS MART</b></a></div>
  <div class="au-body">
    <div id="already" class="au-already au-hide">
      <div>Aap pehle se login hain.</div>
      <button type="button" id="contBtn">Continue</button>
      <button type="button" id="outBtn">Logout</button>
    </div>

    <!-- PASSWORD LOGIN -->
    <section id="pwPanel">
      <h1>Welcome Back!</h1>
      <p class="au-sub">Apne PS Mart account me login karein</p>
      <div class="au-f"><label for="pwEmail">Email Address</label>
        <input class="au-in" id="pwEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="au-f"><label for="pwPass">Password</label>
        <div class="au-pw"><input class="au-in" id="pwPass" type="password" autocomplete="current-password" placeholder="Enter your password">
          <button type="button" class="au-eye" id="pwEye" aria-label="Show password"></button></div></div>
      <div class="au-row"><a href="forgot-password.html">Forgot Password?</a></div>
      <button class="au-btn" id="pwBtn" type="button">Login</button>
      <div id="msgPw" class="au-msg" role="alert"></div>
      <div class="au-or">OR</div>
      <button class="au-btn alt" id="toOtp" type="button">Login with Email OTP</button>
    </section>

    <!-- EMAIL OTP LOGIN -->
    <section id="otpPanel" class="au-hide">
      <h1>Login with Email OTP</h1>
      <p class="au-sub">Aapke email par ek OTP bheja jayega</p>
      <div class="au-f"><label for="otpEmail">Email Address</label>
        <input class="au-in" id="otpEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
      <button class="au-btn" id="sendBtn" type="button">Send OTP</button>
      <div id="otpBox" class="au-hide" style="margin-top:14px">
        <div class="au-f"><label for="otpCode">OTP</label>
          <input class="au-in" id="otpCode" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="Enter OTP"></div>
        <button class="au-btn" id="verBtn" type="button">Verify OTP &amp; Login</button>
      </div>
      <div id="msgOtp" class="au-msg" role="alert"></div>
      <div class="au-or">OR</div>
      <button class="au-btn alt" id="toPw" type="button">Login with Password</button>
    </section>

    <div class="au-foot">Naye hain? <a href="signup.html">Create Account</a></div>
    <div class="au-small"><a class="au-link" href="seller-register.html">Sell on PS Mart</a> &nbsp;|&nbsp; <a class="au-link" href="delivery-login.html">Delivery partner login</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ps-auth.js"></script>
<script>
(function () {
  var A = PSAuth, sb = A.client, $ = A.$, fails = 0, lockUntil = 0, busy = false;

  A.wireEye("pwPass", "pwEye");

  function show(which) {
    $("pwPanel").classList.toggle("au-hide", which !== "pw");
    $("otpPanel").classList.toggle("au-hide", which !== "otp");
    if (which === "otp" && !$("otpEmail").value) $("otpEmail").value = $("pwEmail").value.trim();
  }
  $("toOtp").addEventListener("click", function () { show("otp"); });
  $("toPw").addEventListener("click", function () { show("pw"); });

  /* ---------- Email + Password ---------- */
  async function passwordLogin() {
    if (busy) return;
    var email = $("pwEmail").value.trim().toLowerCase(), pw = $("pwPass").value;
    if (!A.isEmail(email)) return A.msg("msgPw", "Sahi email address likhein.", "bad");
    if (!pw) return A.msg("msgPw", "Password likhein.", "bad");
    if (Date.now() < lockUntil) return A.msg("msgPw", "Bahut zyada galat koshish. 1 minute baad try karein.", "bad");
    busy = true; $("pwBtn").disabled = true; A.msg("msgPw", "Check ho raha hai...", "info");
    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (r.error || !r.data || !r.data.session) {
        fails++; if (fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; }
        A.msg("msgPw", A.friendly(r.error), "bad");
      } else {
        $("pwPass").value = "";
        var ok = await A.finishLogin(r.data.session, "msgPw");
        if (ok) return;
      }
    } catch (e) { A.msg("msgPw", A.friendly(e), "bad"); }
    busy = false; $("pwBtn").disabled = false;
  }
  $("pwBtn").addEventListener("click", passwordLogin);
  $("pwPass").addEventListener("keydown", function (e) { if (e.key === "Enter") passwordLogin(); });
  $("pwEmail").addEventListener("keydown", function (e) { if (e.key === "Enter") $("pwPass").focus(); });

  /* ---------- Email OTP (purana tareeka, waise hi) ---------- */
  async function sendOtp() {
    var email = $("otpEmail").value.trim().toLowerCase();
    if (!A.isEmail(email)) return A.msg("msgOtp", "Sahi email address likhein.", "bad");
    $("sendBtn").disabled = true; A.msg("msgOtp", "OTP bhej rahe hain...", "info");
    try {
      var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
      if (r.error) { A.msg("msgOtp", A.friendly(r.error), "bad"); $("sendBtn").disabled = false; return; }
      A.msg("msgOtp", "OTP bhej diya gaya. Apna email check karein (spam folder bhi).", "ok");
      $("otpBox").classList.remove("au-hide");
      $("otpCode").focus();
      A.cooldown($("sendBtn"), 60, "Resend OTP");
    } catch (e) { A.msg("msgOtp", A.friendly(e), "bad"); $("sendBtn").disabled = false; }
  }
  async function verifyOtp() {
    if (busy) return;
    var email = $("otpEmail").value.trim().toLowerCase(), code = $("otpCode").value.replace(/\s/g, "");
    if (!A.isEmail(email)) return A.msg("msgOtp", "Sahi email address likhein.", "bad");
    if (!/^\d{6,8}$/.test(code)) return A.msg("msgOtp", "Email me aaya OTP (sirf number) likhein.", "bad");
    busy = true; $("verBtn").disabled = true; A.msg("msgOtp", "OTP check ho raha hai...", "info");
    try {
      var r = await sb.auth.verifyOtp({ email: email, token: code, type: "email" });
      if (r.error || !r.data || !r.data.session) {
        A.msg("msgOtp", A.friendly(r.error || "otp invalid"), "bad");
      } else {
        $("otpCode").value = "";
        var ok = await A.finishLogin(r.data.session, "msgOtp");
        if (ok) return;
      }
    } catch (e) { A.msg("msgOtp", A.friendly(e), "bad"); }
    busy = false; $("verBtn").disabled = false;
  }
  $("sendBtn").addEventListener("click", sendOtp);
  $("verBtn").addEventListener("click", verifyOtp);
  $("otpCode").addEventListener("keydown", function (e) { if (e.key === "Enter") verifyOtp(); });

  /* ---------- Pehle se login ho to ---------- */
  sb.auth.getSession().then(function (s) {
    var ses = s && s.data && s.data.session;
    if (!ses) return;
    $("already").classList.remove("au-hide");
    $("contBtn").addEventListener("click", async function () {
      var r = await A.routeFor(ses.user);
      if (r.blocked) { await sb.auth.signOut(); location.reload(); return; }
      location.replace(r.url);
    });
    $("outBtn").addEventListener("click", async function () { await sb.auth.signOut(); location.reload(); });
  }).catch(function () {});
})();
</script>
</body>
</html>

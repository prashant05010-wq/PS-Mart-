<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Login | PS Mart</title>

<link rel="stylesheet" href="style.css">


<style>

.loginwrap{
  min-height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

.loginbox{
  width:100%;
  max-width:420px;
  background:#fffaf0;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  text-align:center;
  box-sizing:border-box;
}

.loginbox h1{
  margin-bottom:8px;
}

.loginbox p{
  color:#666;
}

.loginbox input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.goldbtn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#c99a3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.goldbtn:hover{
  opacity:.9;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

.hidden{
  display:none;
}

</style>

</head>


<body>


<header class="header">

  <a
    class="logo"
    href="index.html"
  >
    🛍️ <b>PS</b> Mart
  </a>

</header>



<main class="loginwrap">

  <div class="loginbox">

    <h1>
      Welcome to PS Mart
    </h1>

    <p id="subtitle">
      Enter your email to continue
    </p>


    <!-- EMAIL -->

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <!-- SEND OTP -->

    <button
      class="goldbtn"
      id="sendOtpBtn"
      onclick="sendOTP()"
    >
      Send OTP
    </button>


    <!-- OTP -->

    <div
      id="otpBox"
      class="hidden"
    >

      <input
        type="text"
        id="otp"
        placeholder="Enter 8-digit OTP"
        inputmode="numeric"
        maxlength="8"
        autocomplete="one-time-code"
      >


      <button
        class="goldbtn"
        onclick="verifyOTP()"
      >
        Verify OTP & Login
      </button>

    </div>


    <div id="message"></div>

  </div>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- EXISTING FILES -->

<script src="data.js"></script>

<script src="app.js"></script>



<script>

/* =====================================================
   PS MART LOGIN SUPABASE CLIENT
===================================================== */

const psLoginClient =
  window.supabase.createClient(

    "https://nctscffhnztscczjxhat.supabase.co",

  );


/* =====================================================
   SEND OTP
===================================================== */

async function sendOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const message =
    document.getElementById(
      "message"
    );


  const sendButton =
    document.getElementById(
      "sendOtpBtn"
    );


  if(!email){

    message.innerText =
      "Please enter your email.";

    return;

  }


  message.innerText =
    "Sending OTP...";


  sendButton.disabled =
    true;


  try{

    const {
      error
    } =
      await psLoginClient
        .auth
        .signInWithOtp({

          email: email,

          options: {

            shouldCreateUser: true

          }

        });


    if(error){

      console.error(
        "OTP ERROR:",
        error
      );

      message.innerText =
        error.message;

      sendButton.disabled =
        false;

      return;

    }


    message.innerText =
      "OTP sent! Check your email.";


    document
      .getElementById("otpBox")
      .classList
      .remove("hidden");


    sendButton.innerText =
      "Resend OTP";


    sendButton.disabled =
      false;

  }


  catch(error){

    console.error(
      "OTP SEND ERROR:",
      error
    );


    message.innerText =
      "Something went wrong. Please try again.";


    sendButton.disabled =
      false;

  }

}



/* =====================================================
   VERIFY OTP
=================================================
async function verifyOTP(){

  const email = document.getElementById("email").value.trim();
  const otp = document.getElementById("otp").value.trim();
  const message = document.getElementById("message");

  if(!email){
    message.innerText = "Please enter your email.";
    return;
  }

  if(!otp || otp.length !== 8){
    message.innerText = "Please enter the 8-digit OTP.";
    return;
  }

  message.innerText = "Verifying OTP...";

  try{

    const { data, error } =
      await psLoginClient.auth.verifyOtp({
        email: email,
        token: otp,
        type: "email"
      });

    if(error){
      console.error("VERIFY OTP ERROR:", error);
      message.innerText = error.message;
      return;
    }

    if(!data.session){
      message.innerText =
        "Login verified, but session was not created.";
      return;
    }

    /* SAVE / CONFIRM SESSION */

    await psLoginClient.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token
    });

    /* CHECK SESSION */

    const {
      data: sessionData,
      error: sessionError
    } = await psLoginClient.auth.getSession();

    if(sessionError || !sessionData.session){

      console.error("SESSION ERROR:", sessionError);

      message.innerText =
        "Login session could not be created.";

      return;
    }

    message.innerText = "Login successful!";

    /* GET USER */

    const user = sessionData.session.user;

    /* GET ROLE */

    const {
      data: profile,
      error: profileError
    } = await psLoginClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if(profileError){

      console.error("PROFILE ERROR:", profileError);

      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);

      return;
    }

    const role = profile.role;

    /* REDIRECT */

    setTimeout(() => {

      if(role === "seller"){

        window.location.href =
          "seller-dashboard.html";

      }else{

        window.location.href =
          "index.html";

      }

    }, 800);

  }

  catch(error){

    console.error("VERIFY ERROR:", error);

    message.innerText =
      "Something went wrong. Please try again.";

  }

  }


    if(data.session){

      message.innerText =
        "Login successful!";


      /* =========================
         GET LOGGED-IN USER
      ========================= */

      const user =
        data.session.user;


      /* =========================
         GET USER ROLE
      ========================= */

      const {
        data: profile,
        error: profileError
      } =
        await psLoginClient

          .from("profiles")

          .select("role")

          .eq("id", user.id)

          .single();


      /* =========================
         PROFILE ERROR
      ========================= */

      if(profileError){

        console.error(
          "PROFILE ERROR:",
          profileError
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        },700);


        return;

      }


      const role =
        profile.role;


      /* =========================
         ROLE BASED REDIRECT
      ========================= */

      setTimeout(() => {


        /* ADMIN */

        if(role === "admin"){

          window.location.href =
            "index.html";

        }


        /* SELLER */

        else if(role === "seller"){

          window.location.href =
            "seller-dashboard.html";

        }


        /* CUSTOMER */

        else{

          window.location.href =
            "index.html";

        }


      },700);

    }


    else{

      message.innerText =
        "OTP verified. Please try again.";

    }

  }


  catch(error){

    console.error(
      "VERIFY ERROR:",
      error
    );


    message.innerText =
      "Something went wrong. Please try again.";

  }

}

</script>


</body>

</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | PS Mart</title>

<link rel="stylesheet" href="style.css">

<style>
.loginwrap{
  min-height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

.loginbox{
  width:100%;
  max-width:420px;
  background:#fffaf0;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  text-align:center;
}

.loginbox h1{
  margin-bottom:8px;
}

.loginbox p{
  color:#666;
}

.loginbox input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.goldbtn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#c99a3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.goldbtn:hover{
  opacity:.9;
}

#otpBox{
  display:none;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

.backbtn{
  background:none;
  border:0;
  color:#8a641d;
  cursor:pointer;
  margin-top:12px;
}
</style>
</head>

<body>

<header class="header">
  <a class="logo" href="index.html">🛍️ <b>PS</b> Mart</a>
</header>

<main class="loginwrap">

  <div class="loginbox">

    <h1>Welcome to PS Mart</h1>

    <p>Login with your mobile number</p>

    <!-- PHONE BOX -->
    <div id="phoneBox">

      <input
        type="tel"
        id="phone"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
        inputmode="numeric"
      >

      <button class="goldbtn" onclick="sendOTP()">
        Send OTP
      </button>

    </div>


    <!-- OTP BOX -->
    <div id="otpBox">

      <p>OTP sent to your mobile number</p>

      <input
        type="text"
        id="otp"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
        inputmode="numeric"
      >

      <button class="goldbtn" onclick="verifyOTP()">
        Verify OTP & Login
      </button>

      <button class="backbtn" onclick="changeNumber()">
        Change Mobile Number
      </button>

    </div>


    <div id="message"></div>

  </div>

</main>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>
<script src="app.js"></script>


<script>

let userPhone = "";


/* SEND OTP */
async function sendOTP(){

  const phoneInput = document.getElementById("phone");
  const message = document.getElementById("message");

  let phone = phoneInput.value.trim();

  /* Check 10 digit Indian mobile number */

  if(!/^[6-9]\d{9}$/.test(phone)){

    message.innerText = "Please enter a valid 10 digit mobile number.";

    return;
  }

  userPhone = "+91" + phone;

  message.innerText = "Sending OTP...";

  try{

    const { error } = await supabaseClient.auth.signInWithOtp({

      phone: userPhone

    });

    if(error){

      console.error(error);

      message.innerText = error.message;

      return;
    }

    document.getElementById("phoneBox").style.display = "none";

    document.getElementById("otpBox").style.display = "block";

    message.innerText = "OTP sent successfully.";

  }

  catch(err){

    console.error(err);

    message.innerText = "Something went wrong. Please try again.";

  }

}


/* VERIFY OTP */
async function verifyOTP(){

  const otp = document.getElementById("otp").value.trim();

  const message = document.getElementById("message");


  if(!/^\d{6}$/.test(otp)){

    message.innerText = "Please enter 6 digit OTP.";

    return;
  }


  message.innerText = "Verifying OTP...";


  try{

    const { data, error } =
      await supabaseClient.auth.verifyOtp({

        phone: userPhone,

        token: otp,

        type: "sms"

      });


    if(error){

      console.error(error);

      message.innerText = error.message;

      return;
    }


    if(data.session){

      message.innerText = "Login successful!";

      setTimeout(() => {

        window.location.href = "index.html";

      }, 1000);

    }

  }

  catch(err){

    console.error(err);

    message.innerText = "OTP verification failed.";

  }

}


/* CHANGE NUMBER */
function changeNumber(){

  document.getElementById("phoneBox").style.display = "block";

  document.getElementById("otpBox").style.display = "none";

  document.getElementById("otp").value = "";

  document.getElementById("message").innerText = "";

}

</script>

</body>
</html>

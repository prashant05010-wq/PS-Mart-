<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Login | PS Mart</title>

<link rel="stylesheet" href="style.css">

<style>

.loginwrap{
  min-height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

.loginbox{
  width:100%;
  max-width:420px;
  background:#fffaf0;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  text-align:center;
  box-sizing:border-box;
}

.loginbox h1{
  margin-bottom:8px;
}

.loginbox p{
  color:#666;
}

.loginbox input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.goldbtn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#c99a3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.goldbtn:hover{
  opacity:.9;
}

.goldbtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

.hidden{
  display:none;
}

</style>

</head>


<body>


<header class="header">

  <a
    class="logo"
    href="index.html"
  >
    🛍️ <b>PS</b> Mart
  </a>

</header>



<main class="loginwrap">

  <div class="loginbox">

    <h1>
      Welcome to PS Mart
    </h1>

    <p id="subtitle">
      Enter your email to continue
    </p>


    <!-- EMAIL -->

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <!-- SEND OTP -->

    <button
      class="goldbtn"
      id="sendOtpBtn"
      onclick="sendOTP()"
    >
      Send OTP
    </button>


    <!-- OTP -->

    <div
      id="otpBox"
      class="hidden"
    >

      <input
        type="text"
        id="otp"
        placeholder="Enter 8-digit OTP"
        inputmode="numeric"
        maxlength="8"
        autocomplete="one-time-code"
      >

      <button
        class="goldbtn"
        id="verifyBtn"
        onclick="verifyOTP()"
      >
        Verify OTP & Login
      </button>

    </div>


    <div id="message"></div>

  </div>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- EXISTING FILES -->

<script src="data.js"></script>

<script src="app.js"></script>


<script>

/* =====================================================
   PS MART LOGIN SUPABASE CLIENT
===================================================== */

const psLoginClient =
  window.supabase.createClient(

    "https://nctscffhnztscczjxhat.supabase.co",

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHNjZmZobnp0c2Njemp4aGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDM0MjUsImV4cCI6MjEwNjAxOTQyNX0.1bR1XER2te7enAtKXaRdTqPnsigh3VJyCLXVbPjKKWw"

  );


/* =====================================================
   SEND OTP
===================================================== */

async function sendOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const message =
    document.getElementById("message");


  const sendButton =
    document.getElementById("sendOtpBtn");


  if(!email){

    message.innerText =
      "Please enter your email.";

    return;

  }


  message.innerText =
    "Sending OTP...";


  sendButton.disabled = true;


  try{

    const { error } =
      await psLoginClient.auth.signInWithOtp({

        email: email,

        options: {

          shouldCreateUser: true

        }

      });


    if(error){

      console.error(
        "OTP ERROR:",
        error
      );

      message.innerText =
        error.message;

      sendButton.disabled = false;

      return;

    }


    message.innerText =
      "OTP sent! Check your email.";


    document
      .getElementById("otpBox")
      .classList
      .remove("hidden");


    sendButton.innerText =
      "Resend OTP";


    sendButton.disabled = false;

  }


  catch(error){

    console.error(
      "OTP SEND ERROR:",
      error
    );


    message.innerText =
      "Something went wrong. Please try again.";


    sendButton.disabled = false;

  }

}



/* =====================================================
   VERIFY OTP
===================================================== */

async function verifyOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  const message =
    document.getElementById("message");


  const verifyButton =
    document.getElementById("verifyBtn");


  if(!email){

    message.innerText =
      "Please enter your email.";

    return;

  }


  if(!otp || otp.length !== 8){

    message.innerText =
      "Please enter the 8-digit OTP.";

    return;

  }


  message.innerText =
    "Verifying OTP...";


  verifyButton.disabled = true;


  try{

    /* =========================
       VERIFY OTP
    ========================= */

    const {
      data,
      error
    } =
      await psLoginClient.auth.verifyOtp({

        email: email,

        token: otp,

        type: "email"

      });


    if(error){

      console.error(
        "VERIFY OTP ERROR:",
        error
      );

      message.innerText =
        error.message;

      verifyButton.disabled = false;

      return;

    }


    /* =========================
       CHECK SESSION
    ========================= */

    if(!data.session){

      message.innerText =
        "OTP verified, but login session was not created.";

      verifyButton.disabled = false;

      return;

    }


    /* =========================
       SAVE SESSION
    ========================= */

    const {
      data: sessionResult,
      error: sessionError
    } =
      await psLoginClient.auth.setSession({

        access_token:
          data.session.access_token,

        refresh_token:
          data.session.refresh_token

      });


    if(sessionError){

      console.error(
        "SESSION ERROR:",
        sessionError
      );

      message.innerText =
        "Could not save login session.";

      verifyButton.disabled = false;

      return;

    }


    /* =========================
       CONFIRM SESSION
    ========================= */

    const {
      data: currentSession,
      error: currentSessionError
    } =
      await psLoginClient.auth.getSession();


    if(
      currentSessionError ||
      !currentSession.session
    ){

      console.error(
        "CURRENT SESSION ERROR:",
        currentSessionError
      );

      message.innerText =
        "Login session could not be confirmed.";

      verifyButton.disabled = false;

      return;

    }


    /* =========================
       LOGIN SUCCESS
    ========================= */

    message.innerText =
      "Login successful!";


    const user =
      currentSession.session.user;


    console.log(
      "LOGGED IN USER:",
      user.id
    );


    /* =========================
       GET PROFILE ROLE
    ========================= */

    const {
      data: profile,
      error: profileError
    } =
      await psLoginClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();


    /* =========================
       PROFILE NOT FOUND
    ========================= */

    if(profileError){

      console.error(
        "PROFILE ERROR:",
        profileError
      );


      message.innerText =
        "Login successful! Opening PS Mart...";


      setTimeout(() => {

        window.location.href =
          "index.html";

      },1000);


      return;

    }


    const role =
      profile.role;


    console.log(
      "USER ROLE:",
      role
    );


    /* =========================
       REDIRECT
    ========================= */

    setTimeout(() => {


      /* SELLER */

      if(role === "seller"){

        window.location.href =
          "seller-dashboard.html";

      }


      /* ADMIN */

      else if(role === "admin"){

        window.location.href =
          "index.html";

      }


      /* CUSTOMER */

      else{

        window.location.href =
          "index.html";

      }


    },800);

  }


  catch(error){

    console.error(
      "VERIFY ERROR:",
      error
    );


    message.innerText =
      "Something went wrong. Please try again.";


    verifyButton.disabled = false;

  }

}



/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingLogin(){

  try{

    const {
      data
    } =
      await psLoginClient.auth.getSession();


    if(data.session){

      console.log(
        "Existing login session found."
      );

    }

  }

  catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

  }

}


checkExistingLogin();

</script>


</body>

  </html>

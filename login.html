```html
<!doctype html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | PS Mart</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<a class="logo" href="index.html">
🛍️ <b>PS</b> Mart
</a>

</header>


<main class="loginwrap">

<div class="loginbox">

<h1>Welcome to PS Mart</h1>

<p id="formText">
Login to continue shopping
</p>


<!-- NAME -->
<input
id="name"
type="text"
placeholder="Full Name"
style="display:none;"
>


<!-- EMAIL -->
<input
id="email"
type="email"
placeholder="Email address"
>


<!-- PASSWORD -->
<input
id="password"
type="password"
placeholder="Password"
>


<!-- LOGIN -->
<button
id="loginBtn"
class="goldbtn"
onclick="login()">

Login

</button>


<!-- SIGNUP -->
<button
id="signupBtn"
class="goldbtn"
onclick="signup()"
style="display:none;">

Create Account

</button>


<p id="switchText">

New to PS Mart?

<b
onclick="showSignup()"
style="cursor:pointer;">

Create Account

</b>

</p>


<p id="message"></p>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>

<script src="app.js"></script>


<script>

/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email || !password) {

    showMessage(
      "Please enter email and password."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    showMessage(error.message);

    return;

  }


  showMessage(
    "Login successful ✓"
  );


  setTimeout(() => {

    location.href = "index.html";

  }, 800);

}


/* =========================
   SIGNUP
========================= */

async function signup() {

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!name || !email || !password) {

    showMessage(
      "Please fill all fields."
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {

          full_name: name

        }

      }

    });


  if (error) {

    showMessage(error.message);

    return;

  }


  showMessage(
    "Account created ✓ Check your email if verification is required."
  );

}


/* =========================
   SIGNUP SCREEN
========================= */

function showSignup() {

  document.getElementById("name")
    .style.display = "block";


  document.getElementById("loginBtn")
    .style.display = "none";


  document.getElementById("signupBtn")
    .style.display = "block";


  document.getElementById("formText")
    .textContent =
    "Create your PS Mart account";


  document.getElementById("switchText")
    .innerHTML =
    `Already have an account?
     <b onclick="showLogin()" style="cursor:pointer;">
     Login
     </b>`;

}


/* =========================
   LOGIN SCREEN
========================= */

function showLogin() {

  document.getElementById("name")
    .style.display = "none";


  document.getElementById("loginBtn")
    .style.display = "block";


  document.getElementById("signupBtn")
    .style.display = "none";


  document.getElementById("formText")
    .textContent =
    "Login to continue shopping";


  document.getElementById("switchText")
    .innerHTML =
    `New to PS Mart?
     <b onclick="showSignup()" style="cursor:pointer;">
     Create Account
     </b>`;

}


/* =========================
   MESSAGE
========================= */

function showMessage(message) {

  document.getElementById("message")
    .textContent = message;

}

</script>

</body>
</html>
```

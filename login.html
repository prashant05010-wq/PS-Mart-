<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login | PS Mart</title>

<link rel="stylesheet" href="style.css">

<style>

.loginwrap{
  min-height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 15px;
}

.loginbox{
  width:100%;
  max-width:420px;
  background:#fffaf0;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  text-align:center;
  box-sizing:border-box;
}

.loginbox h1{
  margin-bottom:8px;
}

.loginbox p{
  color:#666;
}

.loginbox input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.goldbtn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#c99a3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.goldbtn:hover{
  opacity:.9;
}

.signupbtn{
  background:#333;
}

.resetbtn{
  background:transparent;
  color:#8a641d;
  border:1px solid #c99a3d;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

</style>

</head>

<body>

<header class="header">

  <a class="logo" href="index.html">
    🛍️ <b>PS</b> Mart
  </a>

</header>


<main class="loginwrap">

<div class="loginbox">

  <h1>Welcome to PS Mart</h1>

  <p>Login to continue shopping</p>


  <!-- EMAIL -->

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
  >


  <!-- PASSWORD -->

  <input
    type="password"
    id="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >


  <!-- LOGIN -->

  <button
    class="goldbtn"
    onclick="loginUserNow()"
  >
    Login
  </button>


  <!-- FORGOT PASSWORD -->

  <button
    class="goldbtn resetbtn"
    onclick="resetPassword()"
  >
    Forgot Password?
  </button>


  <!-- CREATE ACCOUNT -->

  <button
    class="goldbtn signupbtn"
    onclick="signupUserNow()"
  >
    Create Account
  </button>


  <div id="message"></div>

</div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>
<script src="app.js"></script>


<script>

/* LOGIN */

async function loginUserNow(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if(!email || !password){

    message.innerText =
      "Please enter email and password.";

    return;
  }


  message.innerText = "Logging in...";


  try{

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if(error){

      console.error(error);

      message.innerText =
        error.message;

      return;
    }


    message.innerText =
      "Login successful!";


    setTimeout(() => {

      window.location.href =
        "index.html";

    }, 800);

  }

  catch(error){

    console.error(error);

    message.innerText =
      "Something went wrong.";

  }

}


/* CREATE ACCOUNT */

async function signupUserNow(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if(!email || !password){

    message.innerText =
      "Please enter email and password.";

    return;
  }


  if(password.length < 6){

    message.innerText =
      "Password must be at least 6 characters.";

    return;
  }


  message.innerText =
    "Creating account...";


  try{

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,
        password: password

      });


    if(error){

      console.error(error);

      message.innerText =
        error.message;

      return;
    }


    if(data.session){

      message.innerText =
        "Account created successfully!";

      setTimeout(() => {

        window.location.href =
          "index.html";

      }, 800);

    }

    else{

      message.innerText =
        "Account created. Check your email to verify your account.";

    }

  }

  catch(error){

    console.error(error);

    message.innerText =
      "Something went wrong.";

  }

}


/* FORGOT PASSWORD */

async function resetPassword(){

  const email =
    document.getElementById("email").value.trim();

  const message =
    document.getElementById("message");


  if(!email){

    message.innerText =
      "Please enter your email first.";

    return;
  }


  message.innerText =
    "Sending password reset email...";


  try{

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(

        email,

        {
          redirectTo:
            "https://prashant05010-wq.github.io/PS-Mart-/login.html"
        }

      );


    if(error){

      console.error(error);

      message.innerText =
        error.message;

      return;
    }


    message.innerText =
      "Password reset link sent. Check your email.";

  }

  catch(error){

    console.error(error);

    message.innerText =
      "Something went wrong.";

  }

}

</script>

</body>

</html>

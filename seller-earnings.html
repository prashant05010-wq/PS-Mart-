<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seller Earnings | PS Mart</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f7f3ee;
      color:#333;
    }

    header{
      background:#4b2e1f;
      color:#fff;
      padding:18px 20px;
      font-size:22px;
      font-weight:bold;
    }

    .container{
      max-width:1000px;
      margin:30px auto;
      padding:0 15px;
    }

    .card{
      background:#fff;
      padding:22px;
      margin-bottom:20px;
      border-radius:12px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }

    .stat{
      text-align:center;
      padding:20px;
      background:#fff;
      border-radius:12px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .stat h2{
      margin:8px 0;
      color:#b8860b;
    }

    .earning{
      font-size:24px;
      font-weight:bold;
      color:#16834a;
    }

    .commission{
      color:#d32f2f;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th,td{
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    th{
      background:#f1e7dc;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:#777;
    }

    @media(max-width:700px){
      .stats{
        grid-template-columns:1fr;
      }

      table{
        font-size:13px;
      }
    }
  </style>
</head>

<body>

<header>
  💰 PS Mart — Seller Earnings
</header>

<div class="container">

  <div class="card">
    <h2>Seller Earnings</h2>
    <p id="sellerInfo">Loading seller information...</p>
  </div>

  <div class="stats">

    <div class="stat">
      <div>Total Sales</div>
      <h2 id="totalSales">₹0</h2>
    </div>

    <div class="stat">
      <div>Commission</div>
      <h2 class="commission" id="totalCommission">₹0</h2>
    </div>

    <div class="stat">
      <div>Your Earnings</div>
      <h2 class="earning" id="yourEarnings">₹0</h2>
    </div>

  </div>

  <div class="card">
    <h2>Sales Details</h2>

    <div id="salesBox">
      Loading...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://nctscffhnztscczjxhat.supabase.co";

const SUPABASE_KEY =
"YAHAN APNI WAHI SUPABASE ANON KEY PASTE KARO JO app.js ME HAI";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function loadEarnings(){

  const {
    data:{user}
  } = await supabaseClient.auth.getUser();

  if(!user){

    alert("Please login first.");

    window.location.href="login.html";

    return;
  }


  const {data:seller,error:sellerError} =
    await supabaseClient
    .from("sellers")
    .select("*")
    .eq("user_id",user.id)
    .single();


  if(sellerError || !seller){

    document.getElementById("sellerInfo").innerText =
      "Seller account not found.";

    return;
  }


  document.getElementById("sellerInfo").innerText =
    "Shop: " + seller.shop_name;


  const {data:items,error} =
    await supabaseClient
    .from("order_items")
    .select(`
      id,
      order_id,
      quantity,
      price,
      seller_id,
      orders(
        id,
        status
      ),
      products(
        name
      )
    `)
    .eq("seller_id",seller.id);


  if(error){

    console.log(error);

    document.getElementById("salesBox").innerHTML =
      "<p>Unable to load earnings.</p>";

    return;
  }


  let totalSales = 0;
  let totalCommission = 0;

  let html = "";


  if(!items || items.length === 0){

    document.getElementById("salesBox").innerHTML =
      '<div class="empty">No sales yet.</div>';

    return;
  }


  html += `
    <table>

      <tr>
        <th>Order</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Sale</th>
        <th>Commission</th>
        <th>Earning</th>
        <th>Status</th>
      </tr>
  `;


  items.forEach(item => {

    const order = item.orders;

    const status =
      order ? order.status : "unknown";


    /*
      Cancelled orders are not counted
      in seller earnings.
    */

    if(status === "cancelled"){
      
      html += `
        <tr>
          <td>#${item.order_id}</td>
          <td>${item.products?.name || "Product"}</td>
          <td>${item.quantity}</td>
          <td>₹${Number(item.price * item.quantity).toFixed(2)}</td>
          <td>₹0</td>
          <td>₹0</td>
          <td>❌ Cancelled</td>
        </tr>
      `;

      return;
    }


    const sale =
      Number(item.price) * Number(item.quantity);


    /*
      Temporary marketplace commission:
      10%
    */

    const commission =
      sale * 0.10;


    const earning =
      sale - commission;


    totalSales += sale;

    totalCommission += commission;


    html += `
      <tr>

        <td>#${item.order_id}</td>

        <td>
          ${item.products?.name || "Product"}
        </td>

        <td>
          ${item.quantity}
        </td>

        <td>
          ₹${sale.toFixed(2)}
        </td>

        <td class="commission">
          ₹${commission.toFixed(2)}
        </td>

        <td class="earning">
          ₹${earning.toFixed(2)}
        </td>

        <td>
          ${status}
        </td>

      </tr>
    `;

  });


  html += `</table>`;


  document.getElementById("salesBox").innerHTML =
    html;


  document.getElementById("totalSales").innerText =
    "₹" + totalSales.toFixed(2);


  document.getElementById("totalCommission").innerText =
    "₹" + totalCommission.toFixed(2);


  document.getElementById("yourEarnings").innerText =
    "₹" + (totalSales-totalCommission).toFixed(2);

}


loadEarnings();

</script>

</body>
</html>

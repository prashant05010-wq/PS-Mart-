<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Checkout | PS Mart</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

  <a class="logo" href="index.html">
    🛍️ <b>PS</b> Mart
  </a>

</header>


<main>

<h1>Checkout</h1>


<div class="checkout">


<!-- DELIVERY ADDRESS -->

<div class="box">

<h2>1. Delivery Address</h2>

<input
  id="fullName"
  placeholder="Full name"
  required
>

<input
  id="phone"
  placeholder="Mobile number"
  type="tel"
  required
>

<input
  id="address"
  placeholder="Address"
  required
>

<input
  id="city"
  placeholder="City"
  required
>

<input
  id="pincode"
  placeholder="PIN code"
  type="number"
  required
>
<!-- GIFT CARD -->

<div
  id="giftCardCheckoutBox"
  style="
    margin:20px 0;
    padding:18px;
    border:1px solid #e4c77d;
    border-radius:14px;
    background:#fffaf0;
  "
>

  <h2 style="margin-top:0;">
    🎁 Gift Card
  </h2>

  <p>
    Have a PS Mart Gift Card? Use it on this order.
  </p>

  <div
    style="
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    "
  >

    <input
      id="checkoutGiftCardCode"
      type="text"
      placeholder="Enter gift card code"
      autocomplete="off"
      style="
        flex:1;
        min-width:220px;
        padding:12px;
        border:1px solid #ddd;
        border-radius:10px;
        text-transform:uppercase;
      "
    >

    <button
      type="button"
      class="goldbtn"
      onclick="checkCheckoutGiftCard()"
    >
      Apply Gift Card
    </button>

  </div>

  <div
    id="checkoutGiftCardMessage"
    style="
      margin-top:12px;
      font-weight:bold;
    "
  ></div>

</div>

<!-- PAYMENT METHOD -->

<h2>2. Payment Method</h2>


<label>

<input
  type="radio"
  name="pay"
  value="UPI"
  checked
  onchange="showPaymentSection()"
>

UPI

</label>


<label>

<input
  type="radio"
  name="pay"
  value="Card"
  onchange="showPaymentSection()"
>

Credit / Debit Card

</label>


<!-- SAVED CARDS -->

<div
  id="savedCardSection"
  style="display:none;margin-top:15px;"
>

  <div
    style="
      padding:15px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fffaf0;
    "
  >

    <h3 style="margin-top:0;">
      💳 Saved Cards
    </h3>

    <div id="savedCardsList">
      Loading saved cards...
    </div>

    <a
      href="saved-cards.html"
      style="
        display:inline-block;
        margin-top:12px;
        color:#b8860b;
        font-weight:bold;
        text-decoration:none;
      "
    >
      ➕ Manage / Add Saved Card
    </a>

  </div>

</div>


<label>

<input
  type="radio"
  name="pay"
  value="COD"
  onchange="showPaymentSection()"
>

Cash on Delivery

</label>


<button
  type="button"
  class="goldbtn block"
  onclick="placeOrder()"
>

🛍️ Place Order

</button>

</div>


<!-- ORDER SUMMARY -->

<div
  id="summary"
  class="box"
></div>


</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>

<script src="app.js"></script>


<script>

let selectedSavedCardId = null;


/* =========================
   PAYMENT METHOD
========================= */

function showPaymentSection() {

  const selected =
    document.querySelector(
      'input[name="pay"]:checked'
    )?.value;


  const section =
    document.getElementById(
      "savedCardSection"
    );


  if (!section) return;


  if (selected === "Card") {

    section.style.display = "block";

    loadSavedCards();

  } else {

    section.style.display = "none";

  }

}


/* =========================
   LOAD SAVED CARDS
========================= */

async function loadSavedCards() {

  const box =
    document.getElementById(
      "savedCardsList"
    );


  if (!box) return;


  box.innerHTML =
    "Loading saved cards...";


  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    box.innerHTML = `
      <p>
        Please login first to use saved cards.
      </p>
    `;

    return;

  }


  const {
    data: cards,
    error
  } =
    await supabaseClient
      .from("saved_cards")
      .select("*")
      .eq("user_id", user.id)
      .order("is_default", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.log(error);

    box.innerHTML = `
      <p>
        Unable to load saved cards.
      </p>
    `;

    return;

  }


  if (!cards || !cards.length) {

    box.innerHTML = `
      <div
        style="
          padding:12px;
          border:1px dashed #bbb;
          border-radius:10px;
        "
      >

        <p style="margin:0 0 8px;">
          No saved cards found.
        </p>

        <a
          href="saved-cards.html"
          style="
            color:#b8860b;
            font-weight:bold;
          "
        >
          Add a Credit / Debit Card →
        </a>

      </div>
    `;

    return;

  }


  const defaultCard =
    cards.find(
      card => card.is_default
    ) || cards[0];


  selectedSavedCardId =
    defaultCard.id;


  box.innerHTML =
    cards.map(card => `

      <label
        style="
          display:block;
          margin-bottom:10px;
          cursor:pointer;
        "
      >

        <input
          type="radio"
          name="savedCard"
          value="${card.id}"
          ${card.id === defaultCard.id ? "checked" : ""}
          onchange="selectedSavedCardId=${card.id}"
        >

        💳
        <b>${escapeHtml(card.brand)}</b>
        •••• ${escapeHtml(card.last4)}

        ${
          card.is_default
            ? `
              <span
                style="
                  color:#b8860b;
                  font-weight:bold;
                "
              >
                &nbsp; Default
              </span>
            `
            : ""
        }

        <br>

        <small>
          ${escapeHtml(card.cardholder_name)}
          •
          ${String(card.expiry_month).padStart(2, "0")}/${card.expiry_year}
        </small>

      </label>

    `).join("");

}


/* =========================
   SAFE TEXT
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
  /* =========================
   CHECKOUT GIFT CARD
========================= */

let checkoutGiftCard = null;

async function checkCheckoutGiftCard() {

  const input =
    document.getElementById("checkoutGiftCardCode");

  const message =
    document.getElementById("checkoutGiftCardMessage");

  const code =
    input.value.trim().toUpperCase();

  if (!code) {

    message.style.color = "red";
    message.textContent =
      "❌ Please enter a gift card code.";

    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {

    message.style.color = "red";
    message.textContent =
      "❌ Please login first.";

    return;
  }

  const {
    data: card,
    error
  } =
    await supabaseClient
      .from("gift_cards")
      .select("*")
      .eq("code", code)
      .eq("user_id", user.id)
      .maybeSingle();

  if (error) {

    console.error(error);

    message.style.color = "red";
    message.textContent =
      "❌ Unable to check gift card.";

    return;
  }

  if (!card) {

    message.style.color = "red";
    message.textContent =
      "❌ Gift card not found in your account.";

    return;
  }

  if (card.status !== "active") {

    message.style.color = "red";
    message.textContent =
      "❌ This gift card is not active.";

    return;
  }

  if (
    card.expires_at &&
    new Date(card.expires_at) < new Date()
  ) {

    message.style.color = "red";
    message.textContent =
      "❌ This gift card has expired.";

    return;
  }

  if (Number(card.balance || 0) <= 0) {

    message.style.color = "red";
    message.textContent =
      "❌ This gift card has no balance.";

    return;
  }

  checkoutGiftCard = card;

  message.style.color = "green";

  message.textContent =
    "✅ Gift Card applied! Balance: ₹" +
    Number(card.balance).toFixed(2);

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder() {

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const pincode =
    document
      .getElementById("pincode")
      .value
      .trim();


  const paymentMethod =
    document.querySelector(
      'input[name="pay"]:checked'
    )?.value || "UPI";


  /* =========================
     VALIDATE DELIVERY
  ========================= */

  if (
    !fullName ||
    !phone ||
    !address ||
    !city ||
    !pincode
  ) {

    alert(
      "Please fill all delivery details."
    );

    return;

  }


  /* =========================
     LOGIN CHECK
  ========================= */

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    alert("Please login first.");

    window.location.href =
      "login.html";

    return;

  }


  /* =========================
     PROFILE
  ========================= */

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("id, role")
      .eq("id", user.id)
      .maybeSingle();


  if (profileError || !profile) {

    console.log(
      "Profile error:",
      profileError
    );

    alert(
      "Customer profile not found."
    );

    return;

  }


  /* =========================
     CART
  ========================= */

  const c = cart();


  if (!c.length) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  /* =========================
     LOAD PRODUCTS
  ========================= */

  const ids =
    c.map(
      x => x.id
    );


  const {
    data: products,
    error: productError
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .in("id", ids)
      .eq("status", "approved");


  if (productError) {

    console.log(
      productError
    );

    alert(
      "Unable to load products."
    );

    return;

  }


  /* =========================
     CALCULATE TOTAL
  ========================= */

  let total = 0;


  for (const item of c) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(item.id)
      );


    if (!product) continue;


    total +=
      Number(product.price) *
      item.qty;

  }


  if (total <= 0) {

    alert(
      "Unable to calculate order total."
    );

    return;

  }


  /* =========================
     COUPON
  ========================= */

  let couponDiscount = 0;


  const savedCoupon =
    JSON.parse(
      localStorage.getItem(
        "psmart-applied-coupon"
      ) || "null"
    );


  if (savedCoupon) {

    couponDiscount =
      Number(
        savedCoupon.discount || 0
      );

  }


  const finalTotal =
    Math.max(
      0,
      total - couponDiscount
    );


  console.log(
    "Cart Total:",
    total
  );

  console.log(
    "Coupon Discount:",
    couponDiscount
  );

  console.log(
    "Final Total:",
    finalTotal
  );


  /* =========================
     DELIVERY ADDRESS
  ========================= */

  const deliveryAddress =
    `${fullName}, ${phone}, ${address}, ${city} - ${pincode}`;


  /* =========================
     CREATE ORDER
  ========================= */

  const {
    data: order,
    error: orderError
  } =
    await supabaseClient
      .from("orders")
      .insert({

        customer_id:
          profile.id,

        total_amount:
          finalTotal,

        status:
          "placed",

        address:
          deliveryAddress,

        payment_method:
          paymentMethod

      })
      .select()
      .single();


  if (orderError) {

    console.log(
      orderError
    );

    alert(
      "Order could not be created: " +
      orderError.message
    );

    return;

  }


  /* =========================
     CREATE ORDER ITEMS
  ========================= */

  const orderItems = [];


  for (const item of c) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(item.id)
      );


    if (!product) continue;


    orderItems.push({

      order_id:
        order.id,

      product_id:
        product.id,

      seller_id:
        product.seller_id,

      quantity:
        item.qty,

      price:
        product.price

    });

  }


  if (!orderItems.length) {

    alert(
      "No valid products found for this order."
    );

    return;

  }


  const {
    error: itemError
  } =
    await supabaseClient
      .from("order_items")
      .insert(orderItems);


  if (itemError) {

    console.log(
      itemError
    );

    alert(
      "Order created but items could not be saved."
    );

    return;

  }


  /* =========================
     CLEAR CART
  ========================= */

  localStorage.removeItem(
    "psmart-cart"
  );


  localStorage.removeItem(
    "psmart-applied-coupon"
  );


  localStorage.removeItem(
    "psmart-auto-apply-coupon"
  );


  updateCount();


  alert(
    "Order placed successfully! 🎉"
  );


  window.location.href =
    "orders.html";

}

</script>

</body>

</html>

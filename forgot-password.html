<!doctype html>
<html lang="en">
<head>
<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtm.js?id=G-RF64CHGYC8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3B2416">
<title>Forgot Password | PS Mart</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-auth.css">
</head>
<body>
<main class="au-card">
  <div class="au-top"><a class="au-logo" href="index.html" aria-label="PS Mart home"><i>PS</i><b>PS MART</b></a></div>
  <div class="au-body">
    <h1>Forgot Password?</h1>
    <p class="au-sub">Apna registered email likhein. Hum password badalne ka link bhejenge.</p>
    <div class="au-f"><label for="em">Email Address</label>
      <input class="au-in" id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
    <button class="au-btn" id="goBtn" type="button">Send Reset Link</button>
    <div id="msg" class="au-msg" role="alert"></div>
    <div class="au-small">Pehle OTP se login karte the aur password nahi hai? Yahin se naya password set kar sakte hain.</div>
    <div class="au-foot"><a href="login.html">Back to Login</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ps-auth.js"></script>
<script>
(function () {
  var A = PSAuth, sb = A.client, $ = A.$, busy = false;
  async function go() {
    if (busy) return;
    var em = $("em").value.trim().toLowerCase();
    if (!A.isEmail(em)) return A.msg("msg", "Sahi email address likhein.", "bad");
    busy = true; $("goBtn").disabled = true; A.msg("msg", "Bhej rahe hain...", "info");
    try {
      var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: A.baseUrl() + "reset-password.html" });
      if (r.error && /rate limit|too many|security purposes/i.test(r.error.message || "")) {
        A.msg("msg", A.friendly(r.error), "bad"); busy = false; $("goBtn").disabled = false; return;
      }
      /* account hai ya nahi, ye kabhi nahi batate */
      A.msg("msg", "Agar ye email registered hai to password badalne ka link bhej diya gaya hai. Email check karein (spam folder bhi).", "ok");
      busy = false; A.cooldown($("goBtn"), 60, "Resend Link");
      return;
    } catch (e) { A.msg("msg", A.friendly(e), "bad"); }
    busy = false; $("goBtn").disabled = false;
  }
  $("goBtn").addEventListener("click", go);
  $("em").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
})();
</script>
</body>
</html>
